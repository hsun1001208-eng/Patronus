<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Patronus</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{touch-action:manipulation}
#stage{position:fixed;inset:0;overflow:hidden;background:#000}
#dolphin{
  position:absolute;width:260px;height:150px;left:0;top:0;
  opacity:0;pointer-events:none;
  transform-origin:50% 50%;
  will-change:transform,opacity;
  filter:drop-shadow(0 0 5px rgba(170,235,255,.95))
         drop-shadow(0 0 20px rgba(70,175,255,.55));
}
svg{width:100%;height:100%;overflow:visible}
#swim{transform-origin:150px 80px;animation:bodySwim .58s ease-in-out infinite}
#tailGroup{transform-box:fill-box;transform-origin:15% 50%;animation:tailBeat .36s ease-in-out infinite alternate}
#finNear{transform-box:fill-box;transform-origin:50% 0%;animation:finBeat .7s ease-in-out infinite alternate}
#finFar{transform-box:fill-box;transform-origin:50% 100%;animation:finFarBeat .7s ease-in-out infinite alternate}
#dorsal{transform-box:fill-box;transform-origin:50% 100%;animation:dorsalBeat .8s ease-in-out infinite alternate}
@keyframes bodySwim{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(2px) rotate(-1.2deg)}
}
@keyframes tailBeat{
  from{transform:rotate(-13deg)}
  to{transform:rotate(13deg)}
}
@keyframes finBeat{
  from{transform:rotate(-8deg)}
  to{transform:rotate(11deg)}
}
@keyframes finFarBeat{
  from{transform:rotate(7deg)}
  to{transform:rotate(-8deg)}
}
@keyframes dorsalBeat{
  from{transform:rotate(-3deg)}
  to{transform:rotate(4deg)}
}
</style>
</head>
<body>
<div id="stage">
  <div id="dolphin">
    <svg viewBox="0 0 520 300" aria-hidden="true">
      <defs>
        <linearGradient id="mist" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#effcff" stop-opacity=".94"/>
          <stop offset=".30" stop-color="#a9e9ff" stop-opacity=".88"/>
          <stop offset=".68" stop-color="#59bde8" stop-opacity=".63"/>
          <stop offset="1" stop-color="#287bb8" stop-opacity=".28"/>
        </linearGradient>
        <linearGradient id="mist2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#d9f8ff" stop-opacity=".8"/>
          <stop offset="1" stop-color="#55b9e8" stop-opacity=".25"/>
        </linearGradient>
        <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
      </defs>

      <!-- A recognizable bottlenose-dolphin side profile -->
      <g id="swim">
        <!-- far pectoral fin -->
        <path id="finFar" d="M274 151 C258 179 234 211 201 229 C211 196 226 166 250 141Z"
              fill="url(#mist2)" stroke="#bceeff" stroke-opacity=".45" stroke-width="2"/>

        <!-- main dolphin body: rounded forehead/melon, long rostrum, tapered peduncle -->
        <path d="M102 145
                 C119 108 159 84 207 78
                 C245 73 283 82 313 101
                 C334 114 357 119 384 116
                 C413 112 445 112 474 125
                 C451 137 422 142 390 141
                 C365 140 345 143 324 153
                 C294 168 263 188 221 194
                 C177 200 136 185 111 164
                 C101 156 98 151 102 145Z"
              fill="url(#mist)" stroke="#d5f8ff" stroke-opacity=".82" stroke-width="2.2"/>

        <!-- forehead highlight -->
        <path d="M247 91 C276 78 309 87 331 105 C306 110 278 107 249 100Z"
              fill="#e9fcff" fill-opacity=".24" filter="url(#blur)"/>

        <!-- dorsal fin -->
        <path id="dorsal"
              d="M213 82 C216 48 235 22 251 19 C263 38 258 65 246 86Z"
              fill="url(#mist2)" stroke="#c7f3ff" stroke-opacity=".62" stroke-width="2"/>

        <!-- near pectoral fin -->
        <path id="finNear"
              d="M285 158 C303 187 328 216 359 226 C347 191 332 160 311 143Z"
              fill="url(#mist2)" stroke="#c7f3ff" stroke-opacity=".72" stroke-width="2"/>

        <!-- tail stock -->
        <path d="M112 145 C91 137 70 139 51 151 C71 160 92 163 115 157Z"
              fill="url(#mist)" stroke="#d5f8ff" stroke-opacity=".65" stroke-width="2"/>

        <!-- tail flukes: horizontal, like a real dolphin -->
        <g id="tailGroup">
          <path d="M64 153 C45 135 19 124 2 126 C14 145 35 157 60 160Z"
                fill="url(#mist2)" stroke="#c7f3ff" stroke-opacity=".72" stroke-width="2"/>
          <path d="M64 158 C44 176 19 187 3 184 C14 164 36 151 61 151Z"
                fill="url(#mist2)" stroke="#c7f3ff" stroke-opacity=".72" stroke-width="2"/>
        </g>

        <!-- eye -->
        <circle cx="397" cy="122" r="4.2" fill="#071b28"/>
        <circle cx="398.3" cy="120.7" r="1.35" fill="#fff"/>

        <!-- subtle smile line and body contour -->
        <path d="M406 128 C427 129 444 127 459 123"
              fill="none" stroke="#e6fbff" stroke-opacity=".45" stroke-width="2"/>
        <path d="M126 143 C169 112 230 102 291 119 C321 128 348 129 380 125"
              fill="none" stroke="#f1fdff" stroke-opacity=".28" stroke-width="3"/>
      </g>
    </svg>
  </div>
</div>

<script>
const stage=document.getElementById("stage");
const dolphin=document.getElementById("dolphin");
let running=false, raf=0;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

function makeMist(x,y,angle){
  for(let i=0;i<2;i++){
    const p=document.createElement("span");
    const s=8+Math.random()*20;
    p.style.cssText=
      "position:absolute;border-radius:50%;pointer-events:none;width:"+s+"px;height:"+s+
      "px;left:"+(x-s/2)+"px;top:"+(y-s/2)+"px;"+
      "background:radial-gradient(circle,rgba(170,235,255,.28),rgba(80,170,230,.07) 50%,transparent 75%);"+
      "filter:blur(4px)";
    stage.appendChild(p);
    const born=performance.now(), life=800+Math.random()*650;
    function drift(now){
      const q=(now-born)/life;
      if(q>=1){p.remove();return}
      p.style.opacity=String(.55*(1-q));
      p.style.transform=`translate(${-Math.cos(angle)*35*q}px,${-Math.sin(angle)*35*q}px) scale(${1+q*1.5})`;
      requestAnimationFrame(drift);
    }
    requestAnimationFrame(drift);
  }
}

/*
  The path is a large smooth oval.  The dolphin starts completely outside
  the lower-right corner, enters the oval, makes one broad circuit, then
  leaves toward the upper-left.  The whole circuit stays inside the viewport.
*/
function ovalPoint(t){
  const w=innerWidth,h=innerHeight;
  const marginX=Math.min(170,Math.max(115,w*.13));
  const marginY=Math.min(125,Math.max(90,h*.13));
  const cx=w/2, cy=h/2;
  const rx=Math.max(120,w/2-marginX-105);
  const ry=Math.max(90,h/2-marginY-75);

  // start at lower-right (45deg), travel counter-clockwise,
  // then exit at upper-left after one broad sweep.
  const start=Math.PI/4;
  const a=start + t*Math.PI*2.02;
  return {
    x:cx+rx*Math.cos(a),
    y:cy+ry*Math.sin(a)
  };
}

function place(x,y,angle,opacity=1,scale=1){
  dolphin.style.opacity=opacity;
  dolphin.style.transform=
    `translate3d(${x-130}px,${y-75}px,0) rotate(${angle}rad) scale(${scale})`;
}

function summon(){
  if(running)return;
  running=true;
  document.querySelectorAll("#stage>span").forEach(e=>e.remove());

  const w=innerWidth,h=innerHeight;
  const start=ovalPoint(0);
  const end=ovalPoint(1);

  // Fully off-screen lower-right -> oval start.
  const enterFrom={x:w+190,y:h+150};
  // Upper-left exit direction.
  const exitTo={x:-210,y:-170};

  const t0=performance.now();
  const enterDur=1700;
  const swimDur=11500;
  const exitDur=2100;

  function frame(now){
    const elapsed=now-t0;

    if(elapsed<enterDur){
      const q=ease(elapsed/enterDur);
      const x=enterFrom.x+(start.x-enterFrom.x)*q;
      const y=enterFrom.y+(start.y-enterFrom.y)*q;
      const dx=start.x-enterFrom.x,dy=start.y-enterFrom.y;
      place(x,y,Math.atan2(dy,dx),q);
      if(Math.random()<.7)makeMist(x-70*Math.cos(Math.atan2(dy,dx)),y-70*Math.sin(Math.atan2(dy,dx)),Math.atan2(dy,dx));
    }
    else if(elapsed<enterDur+swimDur){
      const q=(elapsed-enterDur)/swimDur;
      const p=ovalPoint(q);
      const p2=ovalPoint(Math.min(1,q+.002));
      const angle=Math.atan2(p2.y-p.y,p2.x-p.x);
      // Gentle vertical breathing motion so it feels alive, not like a sprite.
      const bob=Math.sin(q*Math.PI*16)*2.5;
      place(p.x,p.y+bob,angle,1);
      if(Math.random()<.32)makeMist(p.x-80*Math.cos(angle),p.y-80*Math.sin(angle),angle);
    }
    else if(elapsed<enterDur+swimDur+exitDur){
      const q=ease((elapsed-enterDur-swimDur)/exitDur);
      const x=end.x+(exitTo.x-end.x)*q;
      const y=end.y+(exitTo.y-end.y)*q;
      const angle=Math.atan2(exitTo.y-end.y,exitTo.x-end.x);
      place(x,y,angle,1-q);
      if(Math.random()<.6)makeMist(x-70*Math.cos(angle),y-70*Math.sin(angle),angle);
    }
    else{
      dolphin.style.opacity=0;
      document.querySelectorAll("#stage>span").forEach(e=>e.remove());
      running=false;
      return;
    }
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
}
stage.addEventListener("pointerdown",summon,{passive:true});
</script>
</body>
</html>
