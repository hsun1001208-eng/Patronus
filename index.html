<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patronus Dolphin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            background-color: #000000;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // --- Smoke Particle Engine for Full Body Formation ---
        class PatronusSmokeParticle {
            constructor(x, y, vx, vy, size, maxLife, colorMode) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.size = size;
                this.life = maxLife;
                this.maxLife = maxLife;
                this.colorMode = colorMode; // 'core', 'wisp', 'trail'
                this.angle = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 0.06;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.size += (this.colorMode === 'trail' ? 0.6 : 0.3);
                this.angle += this.vRot;
                this.life--;
            }

            draw(ctx) {
                if (this.life <= 0) return;
                const progress = this.life / this.maxLife;
                const alpha = Math.sin(progress * Math.PI);

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size);

                if (this.colorMode === 'core') {
                    // Bright white-cyan intense spiritual core
                    grad.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.85})`);
                    grad.addColorStop(0.35, `rgba(180, 240, 255, ${alpha * 0.5})`);
                    grad.addColorStop(0.7, `rgba(50, 160, 240, ${alpha * 0.2})`);
                    grad.addColorStop(1, 'rgba(0, 50, 150, 0)');
                } else if (this.colorMode === 'wisp') {
                    // Ethereal wispy outer layer
                    grad.addColorStop(0, `rgba(200, 245, 255, ${alpha * 0.4})`);
                    grad.addColorStop(0.5, `rgba(60, 170, 250, ${alpha * 0.18})`);
                    grad.addColorStop(1, 'rgba(0, 20, 80, 0)');
                } else {
                    // Dissipating tail smoke trail
                    grad.addColorStop(0, `rgba(160, 230, 255, ${alpha * 0.3})`);
                    grad.addColorStop(0.4, `rgba(30, 130, 220, ${alpha * 0.12})`);
                    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                }

                ctx.fillStyle = grad;
                ctx.beginPath();
                // Distorted non-circular smoke shapes
                ctx.ellipse(0, 0, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const trailParticles = [];

        // --- Precise Dolphin Anatomical Mesh & Skeleton Deformer ---
        // Uses authentic Bottlenose Dolphin proportions:
        // Curved melon forehead, distinct beak/snout, falcate hooked dorsal fin, long pectoral flipper, tapered peduncle, wide tail fluke.
        function getDolphinMeshPoints(time) {
            const swimFreq = 16.0;

            // Spine bending function (S-curve undulation)
            function getSpineY(x) {
                const norm = (140 - x) / 280; // 0 at snout tip (+140), 1 at tail fluke tip (-140)
                if (norm < 0.18) {
                    return Math.sin(norm * Math.PI) * 1.2; // Head stays rigid
                }
                const flex = Math.pow((norm - 0.18) / 0.82, 1.9);
                return Math.sin(time * swimFreq - norm * 3.8) * 32 * flex;
            }

            // Return dense sampling points along the dolphin's body contours & interior
            const points = [];

            // 1. Snout & Beak Tip
            const snoutY = getSpineY(140);
            points.push({ x: 140, y: snoutY, type: 'core' });
            points.push({ x: 130, y: snoutY + 1, type: 'core' });

            // 2. Forehead Melon (隆起的圓潤額頭)
            for (let x = 120; x >= 70; x -= 6) {
                const sy = getSpineY(x);
                const norm = (120 - x) / 50;
                const melonBulge = Math.sin(norm * Math.PI) * 18;
                points.push({ x: x, y: sy - 8 - melonBulge, type: 'wisp' }); // Top contour
                points.push({ x: x, y: sy + 4, type: 'core' });            // Interior
            }

            // 3. Main Torso / Back Contour & Belly
            for (let x = 70; x >= -40; x -= 8) {
                const sy = getSpineY(x);
                const bodyRadius = (1 - Math.pow((x - 15) / 85, 2)) * 24 + 6;
                if (bodyRadius > 0) {
                    points.push({ x: x, y: sy - bodyRadius, type: 'wisp' }); // Back
                    points.push({ x: x, y: sy + bodyRadius * 0.8, type: 'wisp' }); // Belly
                    points.push({ x: x, y: sy, type: 'core' }); // Core
                    points.push({ x: x + 4, y: sy - bodyRadius * 0.5, type: 'core' });
                }
            }

            // 4. Falcate Curved Dorsal Fin (彎曲後鈎的經典海豚背鰭)
            const dBaseY = getSpineY(10);
            points.push({ x: 15, y: dBaseY - 22, type: 'wisp' });
            points.push({ x: 5, y: dBaseY - 42, type: 'wisp' });
            points.push({ x: -10, y: dBaseY - 62, type: 'core' }); // Dorsal Tip (hooked back)
            points.push({ x: -8, y: dBaseY - 38, type: 'wisp' });

            // 5. Long Curved Pectoral Flipper (優雅胸鰭)
            const pBaseY = getSpineY(35);
            points.push({ x: 30, y: pBaseY + 16, type: 'wisp' });
            points.push({ x: 12, y: pBaseY + 38, type: 'wisp' });
            points.push({ x: -12, y: pBaseY + 58, type: 'core' }); // Tip
            points.push({ x: 0, y: pBaseY + 32, type: 'wisp' });

            // 6. Tapered Peduncle (漸細的尾柄) & Wide Tail Fluke (雙葉尾鰭)
            for (let x = -40; x >= -120; x -= 8) {
                const sy = getSpineY(x);
                const tailThick = (x + 120) / 80 * 12 + 2;
                points.push({ x: x, y: sy - tailThick, type: 'wisp' });
                points.push({ x: x, y: sy + tailThick, type: 'wisp' });
                points.push({ x: x, y: sy, type: 'core' });
            }

            const flukeY = getSpineY(-135);
            points.push({ x: -130, y: flukeY - 32, type: 'core' }); // Upper Fluke Blade
            points.push({ x: -138, y: flukeY - 16, type: 'wisp' });
            points.push({ x: -135, y: flukeY, type: 'core' });      // Fluke Notch
            points.push({ x: -138, y: flukeY + 16, type: 'wisp' });
            points.push({ x: -130, y: flukeY + 32, type: 'core' }); // Lower Fluke Blade

            return { points, flukeX: -135, flukeY: flukeY };
        }

        function drawPatronusSmokeDolphin(ctx, time, pos) {
            const mesh = getDolphinMeshPoints(time);
            const cos = Math.cos(pos.angle);
            const sin = Math.sin(pos.angle);

            ctx.save();
            ctx.globalCompositeOperation = 'lighter';

            // Render hundreds of overlapping smoke clouds mapped to the dolphin mesh
            mesh.points.forEach((pt) => {
                // World coordinates transformation
                const wx = pos.x + (pt.x * cos - pt.y * sin);
                const wy = pos.y + (pt.x * sin + pt.y * cos);

                // Organic jittering
                const jitterX = (Math.random() - 0.5) * 6;
                const jitterY = (Math.random() - 0.5) * 6;

                const size = (pt.type === 'core' ? Math.random() * 16 + 12 : Math.random() * 22 + 16);
                const p = new PatronusSmokeParticle(
                    wx + jitterX,
                    wy + jitterY,
                    (Math.random() - 0.5) * 1.2 - cos * 1.5,
                    (Math.random() - 0.5) * 1.2 - sin * 1.5,
                    size,
                    Math.random() * 6 + 4, // Very fast lifecycle for fluid live smoke effect
                    pt.type
                );
                p.draw(ctx);
            });

            // Emit long trail smoke wisps from tail fluke
            const tailWx = pos.x + (mesh.flukeX * cos - mesh.flukeY * sin);
            const tailWy = pos.y + (mesh.flukeX * sin + mesh.flukeY * cos);

            for (let k = 0; k < 6; k++) {
                trailParticles.push(new PatronusSmokeParticle(
                    tailWx + (Math.random() - 0.5) * 18,
                    tailWy + (Math.random() - 0.5) * 18,
                    -cos * (Math.random() * 6 + 3) + (Math.random() - 0.5) * 2,
                    -sin * (Math.random() * 6 + 3) + (Math.random() - 0.5) * 2,
                    Math.random() * 26 + 18,
                    Math.random() * 40 + 25,
                    'trail'
                ));
            }

            ctx.restore();
        }

        let isAnimating = false;
        let animProgress = 0;
        let time = 0;
        const duration = 2.0; // Dynamic fast swim speed

        function triggerPatronus() {
            if (isAnimating) return;
            isAnimating = true;
            animProgress = 0;
        }

        window.addEventListener('click', triggerPatronus);
        window.addEventListener('pointerdown', triggerPatronus);
        window.addEventListener('touchstart', triggerPatronus, { passive: true });

        // Curved flight trajectory: Right-Bottom to Left-Top
        function getPathPos(t) {
            const startX = width + 220;
            const startY = height + 220;
            const endX = -280;
            const endY = -280;

            const x = startX + (endX - startX) * t + Math.sin(t * Math.PI) * 140;
            const y = startY + (endY - startY) * t - Math.sin(t * Math.PI) * 90;

            const dt = 0.005;
            const nextX = startX + (endX - startX) * (t + dt) + Math.sin((t + dt) * Math.PI) * 140;
            const nextY = startY + (endY - startY) * (t + dt) - Math.sin((t + dt) * Math.PI) * 90;

            const angle = Math.atan2(nextY - y, nextX - x);

            return { x, y, angle };
        }

        const clockStep = 1 / 60;

        function render() {
            // Pitch dark canvas
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            time += clockStep;

            if (isAnimating) {
                animProgress += clockStep / duration;

                if (animProgress <= 1.0) {
                    const pos = getPathPos(animProgress);
                    drawPatronusSmokeDolphin(ctx, time, pos);
                } else {
                    isAnimating = false;
                }
            }

            // Render active tail smoke trails
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (let i = trailParticles.length - 1; i >= 0; i--) {
                trailParticles[i].update();
                trailParticles[i].draw(ctx);
                if (trailParticles[i].life <= 0) {
                    trailParticles.splice(i, 1);
                }
            }
            ctx.restore();

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
