<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patronus Dolphin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            background-color: #000000;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Tail Smoke Trail Particles Only (身後的煙霧)
        const tailSmokeParticles = [];

        class TailSmoke {
            constructor(x, y, angle) {
                this.x = x;
                this.y = y;
                // Move backward along the angle
                const backAngle = angle + Math.PI + (Math.random() - 0.5) * 0.6;
                const speed = Math.random() * 2.5 + 1.0;
                this.vx = Math.cos(backAngle) * speed;
                this.vy = Math.sin(backAngle) * speed;
                this.radius = Math.random() * 22 + 15;
                this.life = Math.random() * 35 + 20;
                this.maxLife = this.life;
                this.rot = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 0.05;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.radius += 0.8;
                this.rot += this.vRot;
                this.life--;
            }

            draw(ctx) {
                if (this.life <= 0) return;
                const alpha = Math.sin((this.life / this.maxLife) * Math.PI);

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rot);

                const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius);
                grad.addColorStop(0, `rgba(180, 240, 255, ${alpha * 0.45})`);
                grad.addColorStop(0.4, `rgba(70, 190, 255, ${alpha * 0.25})`);
                grad.addColorStop(0.8, `rgba(10, 100, 220, ${alpha * 0.08})`);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Spine deformation for Swimming Wave
        function getSpineY(x, time) {
            const swimFreq = 12.0;
            const norm = (180 - x) / 360;
            if (norm < 0.2) return Math.sin(norm * Math.PI) * 2.0;
            const flexFactor = Math.pow((norm - 0.2) / 0.8, 1.85);
            return Math.sin(time * swimFreq - norm * 3.6) * 40 * flexFactor;
        }

        // Draw solid dolphin body mesh
        function drawDolphinMesh(ctx, time, scale = 1.0) {
            ctx.beginPath();

            const snoutY = getSpineY(185 * scale, time);
            ctx.moveTo(185 * scale, snoutY);

            // --- Upper Body ---
            ctx.quadraticCurveTo(165 * scale, getSpineY(165 * scale, time) + 3 * scale, 152 * scale, getSpineY(152 * scale, time) + 8 * scale);
            ctx.quadraticCurveTo(120 * scale, getSpineY(120 * scale, time) + 37 * scale, 68 * scale, getSpineY(68 * scale, time) + 40 * scale);

            // Dorsal Fin
            const dBaseY = getSpineY(14 * scale, time);
            ctx.lineTo(20 * scale, dBaseY + 37 * scale);
            ctx.quadraticCurveTo(-7 * scale, dBaseY + 82 * scale, -30 * scale, dBaseY + 86 * scale);
            ctx.quadraticCurveTo(-20 * scale, dBaseY + 53 * scale, -24 * scale, dBaseY + 32 * scale);

            // Back -> Tail
            ctx.quadraticCurveTo(-80 * scale, getSpineY(-80 * scale, time) + 21 * scale, -145 * scale, getSpineY(-145 * scale, time) + 8 * scale);

            // Tail Fluke
            const tailY = getSpineY(-178 * scale, time);
            ctx.lineTo(-172 * scale, tailY + 42 * scale);
            ctx.quadraticCurveTo(-182 * scale, tailY + 21 * scale, -175 * scale, tailY);
            ctx.quadraticCurveTo(-182 * scale, tailY - 21 * scale, -172 * scale, tailY - 42 * scale);

            // --- Lower Body ---
            ctx.lineTo(-145 * scale, getSpineY(-145 * scale, time) - 8 * scale);
            ctx.quadraticCurveTo(-80 * scale, getSpineY(-80 * scale, time) - 21 * scale, -26 * scale, getSpineY(-26 * scale, time) - 29 * scale);

            // Pectoral Flipper
            const pBaseY = getSpineY(33 * scale, time);
            ctx.lineTo(26 * scale, pBaseY - 29 * scale);
            ctx.quadraticCurveTo(-3 * scale, pBaseY - 72 * scale, -29 * scale, pBaseY - 78 * scale);
            ctx.quadraticCurveTo(-13 * scale, pBaseY - 48 * scale, 46 * scale, pBaseY - 24 * scale);

            // Belly -> Snout
            ctx.quadraticCurveTo(106 * scale, getSpineY(106 * scale, time) - 16 * scale, 152 * scale, getSpineY(152 * scale, time) - 5 * scale);
            ctx.lineTo(185 * scale, snoutY);
            ctx.closePath();
        }

        function drawPatronusDolphin(ctx, time, pos) {
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(pos.angle);

            ctx.globalCompositeOperation = 'lighter';

            // --- 1. 整隻海豚邊緣高度打霧與廣角發光 (Outer Blur Layer for Full Body Edge) ---
            ctx.save();
            if (ctx.filter !== undefined) ctx.filter = 'blur(16px)';
            ctx.shadowColor = '#00bbff';
            ctx.shadowBlur = 25;

            drawDolphinMesh(ctx, time, 1.0);
            const outerGlowGrad = ctx.createLinearGradient(185, 0, -178, 0);
            outerGlowGrad.addColorStop(0, 'rgba(255, 255, 255, 0.60)');
            outerGlowGrad.addColorStop(0.3, 'rgba(120, 220, 255, 0.45)');
            outerGlowGrad.addColorStop(0.7, 'rgba(30, 140, 240, 0.25)');
            outerGlowGrad.addColorStop(1, 'rgba(0, 60, 180, 0.08)');
            ctx.fillStyle = outerGlowGrad;
            ctx.fill();
            ctx.restore();

            // --- 2. 中層邊緣軟化 (Mid Blur Layer) ---
            ctx.save();
            if (ctx.filter !== undefined) ctx.filter = 'blur(6px)';

            drawDolphinMesh(ctx, time, 1.0);
            const midGlowGrad = ctx.createLinearGradient(185, 0, -178, 0);
            midGlowGrad.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
            midGlowGrad.addColorStop(0.3, 'rgba(180, 240, 255, 0.70)');
            midGlowGrad.addColorStop(0.7, 'rgba(50, 170, 255, 0.45)');
            midGlowGrad.addColorStop(1, 'rgba(10, 90, 210, 0.15)');
            ctx.fillStyle = midGlowGrad;
            ctx.fill();
            ctx.restore();

            // --- 3. 核心清晰海豚體（微磨砂柔邊 blur 2px） ---
            ctx.save();
            if (ctx.filter !== undefined) ctx.filter = 'blur(2px)';

            drawDolphinMesh(ctx, time, 1.0);
            const coreGrad = ctx.createLinearGradient(185, 0, -178, 0);
            coreGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
            coreGrad.addColorStop(0.25, 'rgba(215, 245, 255, 0.85)');
            coreGrad.addColorStop(0.65, 'rgba(80, 190, 255, 0.55)');
            coreGrad.addColorStop(1, 'rgba(20, 110, 220, 0.20)');
            ctx.fillStyle = coreGrad;
            ctx.fill();
            ctx.restore();

            // --- 4. 產生身後的游動煙霧拖尾 (Emit Tail Smoke Particles) ---
            const cos = Math.cos(pos.angle);
            const sin = Math.sin(pos.angle);
            const tailY = getSpineY(-178, time);
            
            // World coordinates of tail tip
            const tailWorldX = pos.x + (-175 * cos - tailY * sin);
            const tailWorldY = pos.y + (-175 * sin + tailY * cos);

            for (let k = 0; k < 3; k++) {
                tailSmokeParticles.push(new TailSmoke(
                    tailWorldX + (Math.random() - 0.5) * 15,
                    tailWorldY + (Math.random() - 0.5) * 15,
                    pos.angle
                ));
            }

            ctx.restore();
        }

        let isAnimating = false;
        let animProgress = 0;
        let time = 0;
        const duration = 2.0; // Perfect balanced speed (2.0 seconds)

        function triggerPatronus() {
            if (isAnimating) return;
            isAnimating = true;
            animProgress = 0;
        }

        window.addEventListener('click', triggerPatronus);
        window.addEventListener('pointerdown', triggerPatronus);
        window.addEventListener('touchstart', triggerPatronus, { passive: true });

        function getPathPos(t) {
            const startX = width + 280;
            const startY = height + 280;
            const endX = -350;
            const endY = -350;

            const x = startX + (endX - startX) * t + Math.sin(t * Math.PI) * 160;
            const y = startY + (endY - startY) * t - Math.sin(t * Math.PI) * 110;

            const dt = 0.005;
            const nextX = startX + (endX - startX) * (t + dt) + Math.sin((t + dt) * Math.PI) * 160;
            const nextY = startY + (endY - startY) * (t + dt) - Math.sin((t + dt) * Math.PI) * 110;

            const angle = Math.atan2(nextY - y, nextX - x);

            return { x, y, angle };
        }

        const clockStep = 1 / 60;

        function render() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            time += clockStep;

            if (isAnimating) {
                animProgress += clockStep / duration;

                if (animProgress <= 1.0) {
                    const pos = getPathPos(animProgress);
                    drawPatronusDolphin(ctx, time, pos);
                } else {
                    isAnimating = false;
                }
            }

            // Render tail smoke particles behind dolphin
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (let i = tailSmokeParticles.length - 1; i >= 0; i--) {
                tailSmokeParticles[i].update();
                tailSmokeParticles[i].draw(ctx);
                if (tailSmokeParticles[i].life <= 0) {
                    tailSmokeParticles.splice(i, 1);
                }
            }
            ctx.restore();

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
