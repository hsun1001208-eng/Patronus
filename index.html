<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patronus Dolphin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            background-color: #000000;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Offscreen canvas to handle heavy blur safely on iOS/iPad Safari
        const dolphinCanvas = document.createElement('canvas');
        dolphinCanvas.width = 600;
        dolphinCanvas.height = 600;
        const dCtx = dolphinCanvas.getContext('2d');

        // Smoke Wisps Trail Class
        const smokePuffs = [];

        class SmokePuff {
            constructor(x, y, vx, vy, rx, ry, angle, maxLife) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.rx = rx;
                this.ry = ry;
                this.angle = angle;
                this.life = maxLife;
                this.maxLife = maxLife;
                this.vRot = (Math.random() - 0.5) * 0.04;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.rx += 0.7;
                this.ry += 0.6;
                this.angle += this.vRot;
                this.life--;
            }

            draw(targetCtx) {
                if (this.life <= 0) return;
                const alpha = Math.sin((this.life / this.maxLife) * Math.PI);

                targetCtx.save();
                targetCtx.translate(this.x, this.y);
                targetCtx.rotate(this.angle);

                const grad = targetCtx.createRadialGradient(0, 0, 0, 0, 0, this.rx);
                grad.addColorStop(0, `rgba(180, 235, 255, ${alpha * 0.25})`);
                grad.addColorStop(0.4, `rgba(80, 185, 255, ${alpha * 0.12})`);
                grad.addColorStop(0.8, `rgba(20, 90, 210, ${alpha * 0.03})`);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                targetCtx.fillStyle = grad;
                targetCtx.beginPath();
                targetCtx.ellipse(0, 0, this.rx, this.ry, 0, 0, Math.PI * 2);
                targetCtx.fill();
                targetCtx.restore();
            }
        }

        // Spine deformation for Swimming Wave
        function getSpineY(x, time) {
            const swimFreq = 13.0;
            const norm = (140 - x) / 280;
            if (norm < 0.2) return Math.sin(norm * Math.PI) * 1.5;
            const flexFactor = Math.pow((norm - 0.2) / 0.8, 1.85);
            return Math.sin(time * swimFreq - norm * 3.6) * 32 * flexFactor;
        }

        // Dolphin shape path relative to center (300, 300)
        function drawDolphinPath(targetCtx, time) {
            targetCtx.beginPath();

            const snoutY = getSpineY(140, time);
            targetCtx.moveTo(140, snoutY);

            // --- 1. 背部與背鰭 (Dorsal Fin UPWARD - Positive -Y in canvas coords) ---
            targetCtx.quadraticCurveTo(125, getSpineY(125, time) - 2, 115, getSpineY(115, time) - 6);
            targetCtx.quadraticCurveTo(90, getSpineY(90, time) - 28, 50, getSpineY(50, time) - 30);

            // 背鰭 (Dorsal Fin 向上)
            const dBaseY = getSpineY(10, time);
            targetCtx.lineTo(15, dBaseY - 28);
            targetCtx.quadraticCurveTo(-5, dBaseY - 62, -22, dBaseY - 65);
            targetCtx.quadraticCurveTo(-15, dBaseY - 40, -18, dBaseY - 24);

            // 背部後段 -> 尾柄
            targetCtx.quadraticCurveTo(-60, getSpineY(-60, time) - 16, -110, getSpineY(-110, time) - 6);

            // 雙葉尾鰭
            const tailY = getSpineY(-135, time);
            targetCtx.lineTo(-130, tailY - 32);
            targetCtx.quadraticCurveTo(-138, tailY - 16, -132, tailY);
            targetCtx.quadraticCurveTo(-138, tailY + 16, -130, tailY + 32);

            // --- 2. 腹部與胸鰭 (Pectoral Fin DOWNWARD - Positive +Y) ---
            targetCtx.lineTo(-110, getSpineY(-110, time) + 6);
            targetCtx.quadraticCurveTo(-60, getSpineY(-60, time) + 16, -20, getSpineY(-20, time) + 22);

            // 胸鰭 (Pectoral Flipper 向下)
            const pBaseY = getSpineY(25, time);
            targetCtx.lineTo(20, pBaseY + 22);
            targetCtx.quadraticCurveTo(-2, pBaseY + 54, -22, pBaseY + 58);
            targetCtx.quadraticCurveTo(-10, pBaseY + 36, 35, pBaseY + 18);

            // 腹部 -> 下巴 -> 吻部
            targetCtx.quadraticCurveTo(80, getSpineY(80, time) + 12, 115, getSpineY(115, time) + 4);
            targetCtx.lineTo(140, snoutY);
            targetCtx.closePath();
        }

        function renderSmokyDolphinToOffscreen(time) {
            dCtx.clearRect(0, 0, 600, 600);
            dCtx.save();
            dCtx.translate(300, 300);

            dCtx.globalCompositeOperation = 'screen';

            // --- Multi-Layer Soft Blurred Vapor Fill ---
            // Outer Heavy Fog Blur (Soft feathered edge)
            dCtx.save();
            dCtx.filter = 'blur(28px)';
            drawDolphinPath(dCtx, time);
            const outerGrad = dCtx.createLinearGradient(140, 0, -135, 0);
            outerGrad.addColorStop(0, 'rgba(210, 245, 255, 0.4)');
            outerGrad.addColorStop(0.3, 'rgba(100, 200, 255, 0.25)');
            outerGrad.addColorStop(0.7, 'rgba(30, 130, 230, 0.12)');
            outerGrad.addColorStop(1, 'rgba(0, 50, 180, 0.02)');
            dCtx.fillStyle = outerGrad;
            dCtx.fill();
            dCtx.restore();

            // Mid Translucent Smoky Body Layer
            dCtx.save();
            dCtx.filter = 'blur(16px)';
            drawDolphinPath(dCtx, time);
            const midGrad = dCtx.createLinearGradient(140, 0, -135, 0);
            midGrad.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
            midGrad.addColorStop(0.35, 'rgba(160, 225, 255, 0.28)');
            midGrad.addColorStop(0.7, 'rgba(50, 160, 240, 0.15)');
            midGrad.addColorStop(1, 'rgba(10, 80, 200, 0.04)');
            dCtx.fillStyle = midGrad;
            dCtx.fill();
            dCtx.restore();

            // Inner Whispy Core (Very soft and blurred, NO HARD EDGES)
            dCtx.save();
            dCtx.filter = 'blur(8px)';
            drawDolphinPath(dCtx, time);
            const coreGrad = dCtx.createLinearGradient(140, 0, -135, 0);
            coreGrad.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
            coreGrad.addColorStop(0.25, 'rgba(200, 240, 255, 0.35)');
            coreGrad.addColorStop(0.6, 'rgba(100, 190, 255, 0.18)');
            coreGrad.addColorStop(1, 'rgba(20, 110, 220, 0.02)');
            dCtx.fillStyle = coreGrad;
            dCtx.fill();
            dCtx.restore();

            // Internal Smoke Clouds inside body
            for (let i = 0; i < 8; i++) {
                dCtx.save();
                dCtx.filter = 'blur(12px)';
                const px = 100 - i * 28 + Math.sin(time * 3 + i) * 8;
                const py = getSpineY(px, time) + Math.cos(time * 2 + i) * 6;
                const rad = 24 + Math.sin(time * 4 + i) * 8;

                const pGrad = dCtx.createRadialGradient(px, py, 0, px, py, rad);
                pGrad.addColorStop(0, 'rgba(230, 250, 255, 0.35)');
                pGrad.addColorStop(0.5, 'rgba(120, 210, 255, 0.18)');
                pGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                dCtx.fillStyle = pGrad;
                dCtx.beginPath();
                dCtx.arc(px, py, rad, 0, Math.PI * 2);
                dCtx.fill();
                dCtx.restore();
            }

            dCtx.restore();
        }

        function drawSmokyPatronus(targetCtx, time, pos) {
            renderSmokyDolphinToOffscreen(time);

            targetCtx.save();
            targetCtx.translate(pos.x, pos.y);
            targetCtx.rotate(pos.angle);

            targetCtx.globalCompositeOperation = 'lighter';
            // Draw blurred offscreen canvas
            targetCtx.drawImage(dolphinCanvas, -300, -300);

            // Spawn Trailing Vapor Smoke Wisps
            const cos = Math.cos(pos.angle);
            const sin = Math.sin(pos.angle);
            const tailY = getSpineY(-135, time);

            for (let k = 0; k < 4; k++) {
                const tWy = tailY + (Math.random() - 0.5) * 26;
                const wx = pos.x + (-130 * cos - tWy * sin);
                const wy = pos.y + (-130 * sin + tWy * cos);

                smokePuffs.push(new SmokePuff(
                    wx, wy,
                    -cos * (Math.random() * 4 + 2) + (Math.random() - 0.5) * 2,
                    -sin * (Math.random() * 4 + 2) + (Math.random() - 0.5) * 2,
                    Math.random() * 32 + 22,
                    Math.random() * 24 + 16,
                    Math.random() * Math.PI * 2,
                    Math.random() * 35 + 25
                ));
            }

            targetCtx.restore();
        }

        let isAnimating = false;
        let animProgress = 0;
        let time = 0;
        const duration = 2.4;

        function triggerPatronus() {
            if (isAnimating) return;
            isAnimating = true;
            animProgress = 0;
        }

        window.addEventListener('click', triggerPatronus);
        window.addEventListener('pointerdown', triggerPatronus);
        window.addEventListener('touchstart', triggerPatronus, { passive: true });

        function getPathPos(t) {
            const startX = width + 220;
            const startY = height + 220;
            const endX = -280;
            const endY = -280;

            const x = startX + (endX - startX) * t + Math.sin(t * Math.PI) * 140;
            const y = startY + (endY - startY) * t - Math.sin(t * Math.PI) * 90;

            const dt = 0.005;
            const nextX = startX + (endX - startX) * (t + dt) + Math.sin((t + dt) * Math.PI) * 140;
            const nextY = startY + (endY - startY) * (t + dt) - Math.sin((t + dt) * Math.PI) * 90;

            const angle = Math.atan2(nextY - y, nextX - x);

            return { x, y, angle };
        }

        const clockStep = 1 / 60;

        function render() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            time += clockStep;

            if (isAnimating) {
                animProgress += clockStep / duration;

                if (animProgress <= 1.0) {
                    const pos = getPathPos(animProgress);
                    drawSmokyPatronus(ctx, time, pos);
                } else {
                    isAnimating = false;
                }
            }

            // Render ambient trailing smoke
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (let i = smokePuffs.length - 1; i >= 0; i--) {
                smokePuffs[i].update();
                smokePuffs[i].draw(ctx);
                if (smokePuffs[i].life <= 0) {
                    smokePuffs.splice(i, 1);
                }
            }
            ctx.restore();

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
