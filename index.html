<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Patronus Dolphin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            background-color: #000000;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            cursor: pointer;
            touch-action: manipulation;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Balanced Silver-Blue Smoke Wisps
        const smokePuffs = [];

        class SmokePuff {
            constructor(x, y, vx, vy, rx, ry, angle, maxLife) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.rx = rx;
                this.ry = ry;
                this.angle = angle;
                this.life = maxLife;
                this.maxLife = maxLife;
                this.vRot = (Math.random() - 0.5) * 0.03;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.rx += 0.6;
                this.ry += 0.5;
                this.angle += this.vRot;
                this.life--;
            }

            draw(ctx) {
                if (this.life <= 0) return;
                const alpha = Math.sin((this.life / this.maxLife) * Math.PI);

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Perfectly balanced opacity for visible yet airy patronus smoke
                const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.rx);
                grad.addColorStop(0, `rgba(220, 245, 255, ${alpha * 0.18})`);
                grad.addColorStop(0.35, `rgba(100, 205, 255, ${alpha * 0.10})`);
                grad.addColorStop(0.75, `rgba(25, 120, 230, ${alpha * 0.03})`);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.rx, this.ry, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Spine deformation for Swimming Wave
        function getSpineY(x, time) {
            const swimFreq = 12.0;
            const norm = (180 - x) / 360;
            if (norm < 0.2) return Math.sin(norm * Math.PI) * 2.0;
            const flexFactor = Math.pow((norm - 0.2) / 0.8, 1.85);
            return Math.sin(time * swimFreq - norm * 3.6) * 40 * flexFactor;
        }

        // Enhanced Anatomy & Clearer Tail Fluke Definition
        function drawDolphinMesh(ctx, time, scale = 1.0) {
            ctx.save();
            ctx.scale(scale, scale);
            ctx.beginPath();

            const snoutY = getSpineY(185, time);
            ctx.moveTo(185, snoutY);

            // --- 1. 上半身：吻部 -> 額頭 -> 背部 -> 背鰭 ---
            ctx.quadraticCurveTo(165, getSpineY(165, time) + 3, 152, getSpineY(152, time) + 8);
            ctx.quadraticCurveTo(120, getSpineY(120, time) + 37, 68, getSpineY(68, time) + 40);

            // 背鰭 (Dorsal Fin)
            const dBaseY = getSpineY(14, time);
            ctx.lineTo(20, dBaseY + 37);
            ctx.quadraticCurveTo(-7, dBaseY + 82, -30, dBaseY + 86);
            ctx.quadraticCurveTo(-20, dBaseY + 53, -24, dBaseY + 32);

            // 背部後段 -> 尾柄上緣
            ctx.quadraticCurveTo(-80, getSpineY(-80, time) + 21, -145, getSpineY(-145, time) + 8);

            // 雙葉尾鰭 (Tail Fluke) - Distinct, enlarged & sharper blades
            const tailY = getSpineY(-178, time);
            ctx.lineTo(-170, tailY + 48);
            ctx.quadraticCurveTo(-185, tailY + 24, -178, tailY);
            ctx.quadraticCurveTo(-185, tailY - 24, -170, tailY - 48);

            // --- 2. 下半身：尾柄下緣 -> 腹部 -> 胸鰭 -> 下巴 ---
            ctx.lineTo(-145, getSpineY(-145, time) - 8);
            ctx.quadraticCurveTo(-80, getSpineY(-80, time) - 21, -26, getSpineY(-26, time) - 29);

            // 胸鰭 (Pectoral Flipper)
            const pBaseY = getSpineY(33, time);
            ctx.lineTo(26, pBaseY - 29);
            ctx.quadraticCurveTo(-3, pBaseY - 72, -29, pBaseY - 78);
            ctx.quadraticCurveTo(-13, pBaseY - 48, 46, pBaseY - 24);

            // 腹部 -> 下巴 -> 吻部
            ctx.quadraticCurveTo(106, getSpineY(106, time) - 16, 152, getSpineY(152, time) - 5);
            ctx.lineTo(185, snoutY);
            ctx.closePath();
            ctx.restore();
        }

        function drawSmokyPatronus(ctx, time, pos) {
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(pos.angle);

            const minDim = Math.min(width, height);
            const dolphinScale = minDim < 600 ? 0.75 : 1.0;

            ctx.globalCompositeOperation = 'lighter';

            // --- Pass 1: 超巨額打霧外暈 ---
            ctx.save();
            if (ctx.filter !== undefined) ctx.filter = 'blur(60px)';
            ctx.shadowColor = '#60d0ff';
            ctx.shadowBlur = 45;
            
            drawDolphinMesh(ctx, time, dolphinScale);
            // Elevated gradient brightness towards tail stop (-178) so the tail stands out clearly
            const outerGrad = ctx.createLinearGradient(185 * dolphinScale, 0, -185 * dolphinScale, 0);
            outerGrad.addColorStop(0, 'rgba(230, 250, 255, 0.48)');
            outerGrad.addColorStop(0.3, 'rgba(110, 205, 255, 0.32)');
            outerGrad.addColorStop(0.7, 'rgba(40, 150, 245, 0.22)');
            outerGrad.addColorStop(1, 'rgba(20, 100, 220, 0.12)');
            ctx.fillStyle = outerGrad;
            ctx.fill();
            ctx.restore();

            // --- Pass 2: 大範圍蒸氣過渡霧 ---
            ctx.save();
            if (ctx.filter !== undefined) ctx.filter = 'blur(36px)';

            drawDolphinMesh(ctx, time, dolphinScale);
            const transitionGrad = ctx.createLinearGradient(185 * dolphinScale, 0, -185 * dolphinScale, 0);
            transitionGrad.addColorStop(0, 'rgba(255, 255, 255, 0.48)');
            transitionGrad.addColorStop(0.35, 'rgba(160, 225, 255, 0.35)');
            transitionGrad.addColorStop(0.75, 'rgba(60, 175, 250, 0.22)');
            transitionGrad.addColorStop(1, 'rgba(20, 110, 225, 0.14)');
            ctx.fillStyle = transitionGrad;
            ctx.fill();
            ctx.restore();

            // --- Pass 3: 中層軟霧輪廓 ---
            ctx.save();
            if (ctx.filter !== undefined) ctx.filter = 'blur(20px)';

            drawDolphinMesh(ctx, time, dolphinScale);
            const midGrad = ctx.createLinearGradient(185 * dolphinScale, 0, -185 * dolphinScale, 0);
            midGrad.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
            midGrad.addColorStop(0.35, 'rgba(170, 230, 255, 0.38)');
            midGrad.addColorStop(0.75, 'rgba(80, 185, 255, 0.25)');
            midGrad.addColorStop(1, 'rgba(30, 130, 230, 0.16)');
            ctx.fillStyle = midGrad;
            ctx.fill();
            ctx.restore();

            // --- Pass 4: 核心高亮柔霧 (清晰尾巴核心) ---
            ctx.save();
            if (ctx.filter !== undefined) ctx.filter = 'blur(12px)';

            drawDolphinMesh(ctx, time, dolphinScale);
            const coreGrad = ctx.createLinearGradient(185 * dolphinScale, 0, -185 * dolphinScale, 0);
            coreGrad.addColorStop(0, 'rgba(255, 255, 255, 0.60)');
            coreGrad.addColorStop(0.25, 'rgba(210, 245, 255, 0.40)');
            coreGrad.addColorStop(0.65, 'rgba(120, 215, 255, 0.28)');
            coreGrad.addColorStop(1, 'rgba(60, 160, 245, 0.20)');
            ctx.fillStyle = coreGrad;
            ctx.fill();
            ctx.restore();

            // --- Pass 5: 適度靈動煙霧粒子 ---
            const cos = Math.cos(pos.angle);
            const sin = Math.sin(pos.angle);

            // Balanced generation rate & position around tail
            if (Math.random() < 0.65) {
                const pt = { x: -175 * dolphinScale, y: getSpineY(-178, time) * dolphinScale };
                const localX = pt.x + (Math.random() - 0.5) * 25 * dolphinScale;
                const localY = pt.y + (Math.random() - 0.5) * 25 * dolphinScale;
                const wx = pos.x + (localX * cos - localY * sin);
                const wy = pos.y + (localX * sin + localY * cos);

                smokePuffs.push(new SmokePuff(
                    wx, wy,
                    -cos * (Math.random() * 2.8 + 1.5) + (Math.random() - 0.5) * 1.8,
                    -sin * (Math.random() * 2.8 + 1.5) + (Math.random() - 0.5) * 1.8,
                    (Math.random() * 30 + 20) * dolphinScale,
                    (Math.random() * 24 + 15) * dolphinScale,
                    Math.random() * Math.PI * 2,
                    Math.random() * 32 + 22
                ));
            }

            ctx.restore();
        }

        let isAnimating = false;
        let animProgress = 0;
        let time = 0;
        const duration = 2.8;

        function triggerPatronus() {
            if (isAnimating) return;
            isAnimating = true;
            animProgress = 0;
        }

        window.addEventListener('click', triggerPatronus);
        window.addEventListener('pointerdown', triggerPatronus);
        window.addEventListener('touchstart', triggerPatronus, { passive: true });

        function getPathPos(t) {
            const margin = Math.min(width, height) * 0.35 + 150;
            const startX = width + margin;
            const startY = height + margin;
            const endX = -margin;
            const endY = -margin;

            const baseX = startX + (endX - startX) * t;
            const baseY = startY + (endY - startY) * t;

            const isPortrait = height > width;
            const curveFactor = isPortrait ? width * 0.15 : Math.min(width, height) * 0.22;

            const x = baseX + Math.sin(t * Math.PI) * curveFactor;
            const y = baseY - Math.sin(t * Math.PI) * (curveFactor * 0.7);

            const dt = 0.005;
            const nextBaseX = startX + (endX - startX) * (t + dt);
            const nextBaseY = startY + (endY - startY) * (t + dt);
            const nextX = nextBaseX + Math.sin((t + dt) * Math.PI) * curveFactor;
            const nextY = nextBaseY - Math.sin((t + dt) * Math.PI) * (curveFactor * 0.7);

            const angle = Math.atan2(nextY - y, nextX - x);

            return { x, y, angle };
        }

        const clockStep = 1 / 60;

        function render() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            time += clockStep;

            if (isAnimating) {
                animProgress += clockStep / duration;

                if (animProgress <= 1.0) {
                    const pos = getPathPos(animProgress);
                    drawSmokyPatronus(ctx, time, pos);
                } else {
                    isAnimating = false;
                }
            }

            // Render balanced ambient smoke trail
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            if (ctx.filter !== undefined) ctx.filter = 'blur(16px)';

            for (let i = smokePuffs.length - 1; i >= 0; i--) {
                smokePuffs[i].update();
                smokePuffs[i].draw(ctx);
                if (smokePuffs[i].life <= 0) {
                    smokePuffs.splice(i, 1);
                }
            }
            ctx.restore();

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
