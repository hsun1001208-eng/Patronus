<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patronus Dolphin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            background-color: #030712;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .hint {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(160, 220, 255, 0.6);
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 14px;
            letter-spacing: 2px;
            pointer-events: none;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(100, 200, 255, 0.5);
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>
    <div class="hint" id="hint">點擊畫面 召喚海豚護法 Expecto Patronum</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const hint = document.getElementById('hint');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // --- Smoke Particle Class ---
        class SmokeParticle {
            constructor(x, y, vx, vy, size, maxLife, colorType) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.size = size;
                this.maxLife = maxLife;
                this.life = maxLife;
                this.colorType = colorType; // 'core', 'smoke', 'spark'
                this.rot = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 0.05;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.size += 0.35; // Expand as smoke dissipates
                this.rot += this.vRot;
                this.life--;
            }

            draw(ctx) {
                if (this.life <= 0) return;
                const alpha = Math.max(0, (this.life / this.maxLife));
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rot);

                const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size);
                if (this.colorType === 'core') {
                    grad.addColorStop(0, `rgba(220, 245, 255, ${alpha * 0.8})`);
                    grad.addColorStop(0.4, `rgba(100, 200, 255, ${alpha * 0.4})`);
                    grad.addColorStop(1, 'rgba(0, 100, 220, 0)');
                } else if (this.colorType === 'smoke') {
                    grad.addColorStop(0, `rgba(160, 225, 255, ${alpha * 0.35})`);
                    grad.addColorStop(0.5, `rgba(60, 150, 240, ${alpha * 0.15})`);
                    grad.addColorStop(1, 'rgba(10, 40, 100, 0)');
                } else {
                    // Sparkle / Essence
                    grad.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.9})`);
                    grad.addColorStop(0.5, `rgba(140, 220, 255, ${alpha * 0.5})`);
                    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                }

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const particles = [];

        // Accurate 2D Dolphin Silhouette Path Generator (Normalised 0~1)
        function getDolphinPoints(time) {
            // Undulating body deformation
            const tailWave = Math.sin(time * 12) * 12;

            return [
                // Snout / Beak
                { x: 120, y: 0 },
                // Forehead Melon
                { x: 90, y: -18 },
                { x: 50, y: -30 },
                // Back & Dorsal Fin
                { x: 20, y: -32 },
                { x: -5, y: -65 }, // Dorsal Tip
                { x: -25, y: -30 },
                // Tail stock top
                { x: -60, y: -18 + tailWave * 0.4 },
                { x: -95, y: -8 + tailWave * 0.8 },
                // Fluke Top Blade
                { x: -115, y: -35 + tailWave },
                { x: -118, y: tailWave },
                // Fluke Bottom Blade
                { x: -115, y: 35 + tailWave },
                // Tail stock bottom
                { x: -95, y: 8 + tailWave * 0.8 },
                { x: -60, y: 15 + tailWave * 0.4 },
                // Pectoral Flipper
                { x: -10, y: 22 },
                { x: -25, y: 55 },
                { x: 15, y: 28 },
                // Belly / Jaw
                { x: 60, y: 18 },
                { x: 100, y: 8 }
            ];
        }

        let isAnimating = false;
        let animProgress = 0;
        let time = 0;

        function triggerPatronus() {
            if (isAnimating) return;
            isAnimating = true;
            animProgress = 0;
            if (hint) hint.style.opacity = '0';
        }

        window.addEventListener('click', triggerPatronus);
        window.addEventListener('pointerdown', triggerPatronus);
        window.addEventListener('touchstart', triggerPatronus, { passive: true });

        // Path from Right-Bottom to Left-Top (右下 -> 左上)
        function getSwimmingPosition(t) {
            // Start: (width + 150, height + 150) -> End: (-200, -200)
            const startX = width + 150;
            const startY = height + 150;
            const endX = -200;
            const endY = -200;

            // Curved path trajectory
            const currentX = startX + (endX - startX) * t + Math.sin(t * Math.PI * 2) * 80;
            const currentY = startY + (endY - startY) * t + Math.cos(t * Math.PI * 2) * 60;

            // Calculate angle (tangent)
            const nextT = t + 0.01;
            const nextX = startX + (endX - startX) * nextT + Math.sin(nextT * Math.PI * 2) * 80;
            const nextY = startY + (endY - startY) * nextT + Math.cos(nextT * Math.PI * 2) * 60;

            const angle = Math.atan2(nextY - currentY, nextX - currentX);

            return { x: currentX, y: currentY, angle: angle };
        }

        function spawnDolphinSmoke(pos, time) {
            const points = getDolphinPoints(time);
            const cos = Math.cos(pos.angle);
            const sin = Math.sin(pos.angle);

            // Emit wisp particles along the dolphin contour & interior
            points.forEach((pt, i) => {
                // Transform point into world coordinates
                const wx = pos.x + (pt.x * cos - pt.y * sin);
                const wy = pos.y + (pt.x * sin + pt.y * cos);

                // Dense smokey core
                for (let k = 0; k < 2; k++) {
                    const vx = (Math.random() - 0.5) * 1.5 - cos * 1.2;
                    const vy = (Math.random() - 0.5) * 1.5 - sin * 1.2;
                    particles.push(new SmokeParticle(
                        wx + (Math.random() - 0.5) * 8,
                        wy + (Math.random() - 0.5) * 8,
                        vx, vy,
                        Math.random() * 12 + 10,
                        Math.random() * 25 + 20,
                        'core'
                    ));
                }

                // Ethereal outer smoke wisps
                if (Math.random() < 0.6) {
                    const vx = (Math.random() - 0.5) * 2.5 - cos * 2.0;
                    const vy = (Math.random() - 0.5) * 2.5 - sin * 2.0;
                    particles.push(new SmokeParticle(
                        wx + (Math.random() - 0.5) * 16,
                        wy + (Math.random() - 0.5) * 16,
                        vx, vy,
                        Math.random() * 22 + 18,
                        Math.random() * 40 + 25,
                        'smoke'
                    ));
                }
            });

            // Tail Fluke Heavy Smoke Trail (霧氣尾跡)
            const tailPt = points[8]; // Tail fluke point
            const tailX = pos.x + (tailPt.x * cos - tailPt.y * sin);
            const tailY = pos.y + (tailPt.x * sin + tailPt.y * cos);

            for (let k = 0; k < 6; k++) {
                const vx = -cos * (Math.random() * 3 + 2) + (Math.random() - 0.5) * 2;
                const vy = -sin * (Math.random() * 3 + 2) + (Math.random() - 0.5) * 2;
                particles.push(new SmokeParticle(
                    tailX + (Math.random() - 0.5) * 20,
                    tailY + (Math.random() - 0.5) * 20,
                    vx, vy,
                    Math.random() * 30 + 25,
                    Math.random() * 50 + 35,
                    'smoke'
                ));
            }

            // Magical Sparkles
            for (let k = 0; k < 3; k++) {
                const randPt = points[Math.floor(Math.random() * points.length)];
                const rx = pos.x + (randPt.x * cos - randPt.y * sin);
                const ry = pos.y + (randPt.x * sin + randPt.y * cos);
                particles.push(new SmokeParticle(
                    rx + (Math.random() - 0.5) * 30,
                    ry + (Math.random() - 0.5) * 30,
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2,
                    Math.random() * 6 + 4,
                    Math.random() * 30 + 15,
                    'spark'
                ));
            }
        }

        // --- Main Render Loop ---
        function loop() {
            // Subtle motion blur trail for ethereal magic feel
            ctx.fillStyle = 'rgba(3, 7, 18, 0.22)';
            ctx.fillRect(0, 0, width, height);

            time += 0.05;

            if (isAnimating) {
                animProgress += 0.0055; // Speed of travel

                if (animProgress <= 1.0) {
                    const pos = getSwimmingPosition(animProgress);
                    spawnDolphinSmoke(pos, time);
                } else {
                    isAnimating = false;
                    if (hint) hint.style.opacity = '1';
                }
            }

            // Global additive blending for magical glowing patronus effect
            ctx.globalCompositeOperation = 'lighter';

            // Update & Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            ctx.globalCompositeOperation = 'source-over';

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
