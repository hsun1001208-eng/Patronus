<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Patronus</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
  body{touch-action:manipulation}
  canvas{display:block;width:100vw;height:100vh;background:#000}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let W=0,H=0,dpr=1,active=false,started=0,raf=0;
  const smoke=[];

  function resize(){
    dpr=Math.min(devicePixelRatio||1,2);
    W=innerWidth; H=innerHeight;
    canvas.width=Math.round(W*dpr);
    canvas.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener("resize",resize,{passive:true});
  resize();

  function ease(t){return t*t*(3-2*t)}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  function lerp(a,b,t){return a+(b-a)*t}

  // A rounded-rectangle route kept safely inside the viewport.
  function route(t){
    const inset=Math.max(115,Math.min(170,Math.min(W,H)*.16));
    const x0=inset, y0=inset, x1=W-inset, y1=H-inset;
    const r=Math.max(45,Math.min(100,Math.min(W,H)*.12));
    const seg=[];
    const add=(len,fn)=>seg.push({len,fn});
    const arc=Math.PI*r/2;
    add(x1-x0-2*r,u=>({x:x0+r+u*(x1-x0-2*r),y:y1,dx:1,dy:0}));
    add(arc,u=>{let a=Math.PI/2+u*Math.PI/2;return {x:x1-r+r*Math.cos(a),y:y1-r+r*Math.sin(a),dx:-Math.sin(a),dy:Math.cos(a)}});
    add(y1-y0-2*r,u=>({x:x1,y1:y1, x:x1,y:y1-r-u*(y1-y0-2*r),dx:0,dy:-1}));
    add(arc,u=>{let a=0-u*Math.PI/2;return {x:x1-r+r*Math.cos(a),y:y0+r+r*Math.sin(a),dx:-Math.sin(a),dy:Math.cos(a)}});
    add(x1-x0-2*r,u=>({x:x1-r-u*(x1-x0-2*r),y:y0,dx:-1,dy:0}));
    add(arc,u=>{let a=-Math.PI/2-u*Math.PI/2;return {x:x0+r+r*Math.cos(a),y:y0+r+r*Math.sin(a),dx:-Math.sin(a),dy:Math.cos(a)}});
    add(y1-y0-2*r,u=>({x:x0,y:y0+r+u*(y1-y0-2*r),dx:0,dy:1}));
    add(arc,u=>{let a=Math.PI-u*Math.PI/2;return {x:x0+r+r*Math.cos(a),y:y1-r+r*Math.sin(a),dx:-Math.sin(a),dy:Math.cos(a)}});
    const total=seg.reduce((s,a)=>s+a.len,0);
    let q=((t%1)+1)%1*total;
    for(const s of seg){
      if(q<=s.len)return s.fn(q/s.len);
      q-=s.len;
    }
    return seg[0].fn(0);
  }

  function addSmoke(x,y,ang,amount=2){
    for(let i=0;i<amount;i++){
      smoke.push({
        x:x+Math.random()*12-6,y:y+Math.random()*12-6,
        vx:-Math.cos(ang)*(.25+Math.random()*.8)+(Math.random()-.5)*.5,
        vy:-Math.sin(ang)*(.25+Math.random()*.8)+(Math.random()-.5)*.5,
        life:.45+Math.random()*.65,size:3+Math.random()*9
      });
    }
    if(smoke.length>260)smoke.splice(0,smoke.length-260);
  }

  function drawSmoke(dt){
    for(let i=smoke.length-1;i>=0;i--){
      const s=smoke[i];
      s.x+=s.vx*dt*60; s.y+=s.vy*dt*60; s.life-=dt;
      if(s.life<=0){smoke.splice(i,1);continue}
      ctx.beginPath();
      ctx.fillStyle=`rgba(135,220,255,${Math.min(.22,s.life*.18)})`;
      ctx.shadowBlur=18;ctx.shadowColor="rgba(80,190,255,.45)";
      ctx.arc(s.x,s.y,s.size*(1.5-s.life*.35),0,Math.PI*2);
      ctx.fill();ctx.shadowBlur=0;
    }
  }

  // Recognizable dolphin silhouette: rounded forehead, long rostrum,
  // dorsal fin, pectoral fins and two tail flukes.
  function drawDolphin(x,y,angle,t){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(angle);
    const pulse=Math.sin(t*15);
    const wave=Math.sin(t*15)*.10;
    ctx.globalCompositeOperation="lighter";
    ctx.shadowColor="rgba(85,205,255,.9)";
    ctx.shadowBlur=24;

    ctx.beginPath();
    ctx.moveTo(-64,2);
    ctx.bezierCurveTo(-57,-18,-35,-25,-12,-22);
    ctx.bezierCurveTo(8,-20,22,-12,39,-9);
    ctx.bezierCurveTo(52,-7,63,-11,76,-8);
    ctx.bezierCurveTo(66,1,55,7,42,8);
    ctx.bezierCurveTo(25,10,13,18,-5,20);
    ctx.bezierCurveTo(-28,24,-49,17,-64,2);
    ctx.closePath();
    const body=ctx.createLinearGradient(-60,-20,75,20);
    body.addColorStop(0,"rgba(105,220,255,.12)");
    body.addColorStop(.45,"rgba(180,245,255,.82)");
    body.addColorStop(1,"rgba(65,175,245,.55)");
    ctx.fillStyle=body;ctx.fill();

    // snout
    ctx.beginPath();
    ctx.moveTo(35,-9);ctx.quadraticCurveTo(64,-15,82,-8);
    ctx.quadraticCurveTo(67,-1,39,3);ctx.closePath();
    ctx.fillStyle="rgba(170,240,255,.78)";ctx.fill();

    // dorsal fin
    ctx.beginPath();
    ctx.moveTo(-4,-18);ctx.quadraticCurveTo(2,-45,15,-35);
    ctx.quadraticCurveTo(18,-25,12,-17);ctx.closePath();
    ctx.fillStyle="rgba(115,220,255,.65)";ctx.fill();

    // near pectoral fin
    ctx.beginPath();
    ctx.moveTo(10,10);ctx.quadraticCurveTo(18,38,35,43);
    ctx.quadraticCurveTo(31,18,21,5);ctx.closePath();
    ctx.fillStyle="rgba(100,215,255,.72)";ctx.fill();

    // far pectoral fin
    ctx.beginPath();
    ctx.moveTo(-7,-13);ctx.quadraticCurveTo(-22,-37,-37,-35);
    ctx.quadraticCurveTo(-29,-14,-16,-7);ctx.closePath();
    ctx.fillStyle="rgba(115,225,255,.4)";ctx.fill();

    // flexible tail stock
    ctx.beginPath();
    ctx.moveTo(-55,-8);
    ctx.quadraticCurveTo(-70,-9-7*wave,-82,2+8*wave);
    ctx.quadraticCurveTo(-70,13+7*wave,-55,10);
    ctx.closePath();
    ctx.fillStyle="rgba(120,225,255,.7)";ctx.fill();

    // tail flukes
    ctx.beginPath();
    ctx.moveTo(-78,3);
    ctx.quadraticCurveTo(-99,-16-9*pulse,-112,-12);
    ctx.quadraticCurveTo(-108,5,-84,8);
    ctx.quadraticCurveTo(-105,24+9*pulse,-112,31);
    ctx.quadraticCurveTo(-91,30,-78,7);
    ctx.closePath();
    ctx.fillStyle="rgba(155,240,255,.82)";ctx.fill();

    // eye
    ctx.shadowBlur=4;ctx.fillStyle="rgba(0,20,35,.95)";
    ctx.beginPath();ctx.arc(48,-8,2.6,0,Math.PI*2);ctx.fill();

    // drifting translucent contour
    ctx.shadowBlur=0;ctx.strokeStyle="rgba(210,250,255,.35)";
    ctx.lineWidth=1.2;ctx.beginPath();
    ctx.moveTo(-53,-1);ctx.bezierCurveTo(-15,-32,28,-25,65,-9);ctx.stroke();

    ctx.restore();
  }

  function summon(){
    if(active)return;
    active=true;started=performance.now();smoke.length=0;
    cancelAnimationFrame(raf);
    let last=performance.now();
    const enter=900, lap=10500, exit=1500, total=enter+lap+exit;

    function animate(now){
      const dt=Math.min(.04,(now-last)/1000);last=now;
      const elapsed=now-started;
      ctx.clearRect(0,0,W,H);
      drawSmoke(dt);

      let x,y,dx,dy,opacity=1,scale=1;
      if(elapsed<enter){
        const q=ease(elapsed/enter);
        const target=route(.12);
        x=lerp(W+150,target.x,q); y=lerp(H+130,target.y,q);
        dx=target.dx;dy=target.dy;opacity=q;scale=.86+.14*q;
      }else if(elapsed<enter+lap){
        const q=(elapsed-enter)/lap;
        const p=route(.12+q);
        x=p.x;y=p.y;dx=p.dx;dy=p.dy;
      }else{
        const q=ease(clamp((elapsed-enter-lap)/exit,0,1));
        const from=route(.12);
        x=lerp(from.x,-170,q);y=lerp(from.y,-150,q);
        dx=-.72;dy=-.7;opacity=1-q;scale=1-.08*q;
      }

      const angle=Math.atan2(dy,dx);
      addSmoke(x,y,angle,elapsed<total?2:0);
      drawDolphin(x,y,angle,now/1000);
      ctx.globalAlpha=opacity;
      // redraw a soft veil over the dolphin's edges by using compositing glow
      ctx.globalAlpha=1;

      if(elapsed<total){
        raf=requestAnimationFrame(animate);
      }else{
        ctx.clearRect(0,0,W,H);smoke.length=0;active=false;
      }
    }
    raf=requestAnimationFrame(animate);
  }

  addEventListener("pointerdown",summon,{passive:true});
})();
</script>
</body>
</html>
