<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patronus Dolphin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            background-color: #000000;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Smoke Wisps Array
        const smokeWisps = [];

        class SmokeParticle {
            constructor(x, y, vx, vy, size, maxLife, type = 'trail') {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.size = size;
                this.life = maxLife;
                this.maxLife = maxLife;
                this.type = type;
                this.angle = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 0.05;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.size += 0.4;
                this.angle += this.vRot;
                this.life--;
            }

            draw(ctx) {
                if (this.life <= 0) return;
                const alpha = Math.sin((this.life / this.maxLife) * Math.PI);
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size);
                if (this.type === 'trail') {
                    grad.addColorStop(0, `rgba(220, 245, 255, ${alpha * 0.45})`);
                    grad.addColorStop(0.35, `rgba(50, 180, 255, ${alpha * 0.22})`);
                    grad.addColorStop(0.8, `rgba(5, 70, 180, ${alpha * 0.06})`);
                    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                } else {
                    grad.addColorStop(0, `rgba(240, 250, 255, ${alpha * 0.35})`);
                    grad.addColorStop(0.5, `rgba(80, 200, 255, ${alpha * 0.15})`);
                    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                }

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // --- Authentic Dolphin Spine Deformer & Contour Path ---
        function getSpineY(x, time) {
            const swimFreq = 15.0;
            const norm = (140 - x) / 280;
            if (norm < 0.2) {
                return Math.sin(norm * Math.PI) * 1.5;
            }
            const flexFactor = Math.pow((norm - 0.2) / 0.8, 1.85);
            return Math.sin(time * swimFreq - norm * 3.6) * 32 * flexFactor;
        }

        function createDolphinPath(ctx, time) {
            ctx.beginPath();
            
            // 1. Beak / Snout Tip
            const snoutY = getSpineY(140, time);
            ctx.moveTo(140, snoutY);

            // 2. Beak to Melon (圓潤額頭)
            ctx.quadraticCurveTo(125, getSpineY(125, time) - 2, 115, getSpineY(115, time) - 6);
            ctx.quadraticCurveTo(90, getSpineY(90, time) - 28, 50, getSpineY(50, time) - 30);

            // 3. Back to Dorsal Fin (彎曲背鰭)
            const dBaseY = getSpineY(10, time);
            ctx.lineTo(15, dBaseY - 28);
            ctx.quadraticCurveTo(-5, dBaseY - 62, -22, dBaseY - 65); // Hooked Back
            ctx.quadraticCurveTo(-15, dBaseY - 40, -18, dBaseY - 24);

            // 4. Back to Tail Peduncle
            ctx.quadraticCurveTo(-60, getSpineY(-60, time) - 16, -110, getSpineY(-110, time) - 6);

            // 5. Tail Fluke (雙葉尾鰭)
            const tailY = getSpineY(-135, time);
            ctx.lineTo(-130, tailY - 30);
            ctx.quadraticCurveTo(-138, tailY - 15, -132, tailY);
            ctx.quadraticCurveTo(-138, tailY + 15, -130, tailY + 30);

            // 6. Lower Peduncle to Belly
            ctx.lineTo(-110, getSpineY(-110, time) + 6);
            ctx.quadraticCurveTo(-60, getSpineY(-60, time) + 16, -20, getSpineY(-20, time) + 22);

            // 7. Pectoral Flipper (優雅胸鰭)
            const pBaseY = getSpineY(25, time);
            ctx.lineTo(20, pBaseY + 22);
            ctx.quadraticCurveTo(-2, pBaseY + 52, -22, pBaseY + 56);
            ctx.quadraticCurveTo(-10, pBaseY + 35, 35, pBaseY + 18);

            // 8. Chin to Snout
            ctx.quadraticCurveTo(80, getSpineY(80, time) + 12, 115, getSpineY(115, time) + 4);
            ctx.lineTo(140, snoutY);
            ctx.closePath();
        }

        function drawPatronusDolphin(ctx, time, pos) {
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(pos.angle);

            ctx.save();
            ctx.globalCompositeOperation = 'lighter';

            // Pass 1: Diffuse Outer Atmospheric Glow
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 40;
            createDolphinPath(ctx, time);
            const outerGrad = ctx.createLinearGradient(140, 0, -135, 0);
            outerGrad.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
            outerGrad.addColorStop(0.35, 'rgba(186, 230, 253, 0.45)');
            outerGrad.addColorStop(0.75, 'rgba(56, 189, 248, 0.28)');
            outerGrad.addColorStop(1, 'rgba(2, 132, 199, 0.12)');
            ctx.fillStyle = outerGrad;
            ctx.fill();

            // Pass 2: Bright Luminous Spirit Core Body
            ctx.shadowColor = '#e0f2fe';
            ctx.shadowBlur = 20;
            createDolphinPath(ctx, time);
            const innerGrad = ctx.createLinearGradient(140, 0, -135, 0);
            innerGrad.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
            innerGrad.addColorStop(0.25, 'rgba(224, 242, 254, 0.6)');
            innerGrad.addColorStop(0.65, 'rgba(125, 211, 252, 0.35)');
            innerGrad.addColorStop(1, 'rgba(14, 165, 233, 0.18)');
            ctx.fillStyle = innerGrad;
            ctx.fill();

            // Pass 3: Soft Silver Rim Highlight
            ctx.strokeStyle = 'rgba(240, 249, 255, 0.75)';
            ctx.lineWidth = 1.6;
            ctx.stroke();

            // Pass 4: Internal Volumetric Smoke Nodes (體內流轉靈氣)
            const smokeNodes = [115, 80, 45, 10, -25, -60, -90, -115];
            smokeNodes.forEach((px, i) => {
                const py = getSpineY(px, time);
                const radius = (1 - Math.abs(px) / 150) * 20 + 8;
                const offset = Math.sin(time * 10 + i) * 5;

                const nodeGrad = ctx.createRadialGradient(px, py + offset, 0, px, py + offset, radius);
                nodeGrad.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
                nodeGrad.addColorStop(0.5, 'rgba(125, 211, 252, 0.22)');
                nodeGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = nodeGrad;
                ctx.beginPath();
                ctx.arc(px, py + offset, radius, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();

            // Emit Continuous Trail Smoke Wisps
            const cos = Math.cos(pos.angle);
            const sin = Math.sin(pos.angle);

            // Tail Fluke Trail Emission
            const tailY = getSpineY(-135, time);
            const tailWx = pos.x + (-135 * cos - tailY * sin);
            const tailWy = pos.y + (-135 * sin + tailY * cos);

            for (let k = 0; k < 5; k++) {
                smokeWisps.push(new SmokeParticle(
                    tailWx + (Math.random() - 0.5) * 16,
                    tailWy + (Math.random() - 0.5) * 16,
                    -cos * (Math.random() * 5 + 3) + (Math.random() - 0.5) * 2,
                    -sin * (Math.random() * 5 + 3) + (Math.random() - 0.5) * 2,
                    Math.random() * 24 + 16,
                    Math.random() * 35 + 25,
                    'trail'
                ));
            }

            // Body Edge Wisps
            if (Math.random() < 0.8) {
                const randX = (Math.random() - 0.5) * 220;
                const randY = getSpineY(randX, time) + (Math.random() - 0.5) * 25;
                const wx = pos.x + (randX * cos - randY * sin);
                const wy = pos.y + (randX * sin + randY * cos);

                smokeWisps.push(new SmokeParticle(
                    wx, wy,
                    -cos * (Math.random() * 2 + 1) + (Math.random() - 0.5) * 1.5,
                    -sin * (Math.random() * 2 + 1) + (Math.random() - 0.5) * 1.5,
                    Math.random() * 16 + 10,
                    Math.random() * 25 + 15,
                    'body'
                ));
            }

            ctx.restore();
        }

        let isAnimating = false;
        let animProgress = 0;
        let time = 0;
        const duration = 2.2;

        function triggerPatronus() {
            if (isAnimating) return;
            isAnimating = true;
            animProgress = 0;
        }

        window.addEventListener('click', triggerPatronus);
        window.addEventListener('pointerdown', triggerPatronus);
        window.addEventListener('touchstart', triggerPatronus, { passive: true });

        function getPathPos(t) {
            const startX = width + 220;
            const startY = height + 220;
            const endX = -280;
            const endY = -280;

            const x = startX + (endX - startX) * t + Math.sin(t * Math.PI) * 130;
            const y = startY + (endY - startY) * t - Math.sin(t * Math.PI) * 85;

            const dt = 0.005;
            const nextX = startX + (endX - startX) * (t + dt) + Math.sin((t + dt) * Math.PI) * 130;
            const nextY = startY + (endY - startY) * (t + dt) - Math.sin((t + dt) * Math.PI) * 85;

            const angle = Math.atan2(nextY - y, nextX - x);

            return { x, y, angle };
        }

        const clockStep = 1 / 60;

        function render() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            time += clockStep;

            if (isAnimating) {
                animProgress += clockStep / duration;

                if (animProgress <= 1.0) {
                    const pos = getPathPos(animProgress);
                    drawPatronusDolphin(ctx, time, pos);
                } else {
                    isAnimating = false;
                }
            }

            // Draw Ethereal Wisps & Smoke Trail
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (let i = smokeWisps.length - 1; i >= 0; i--) {
                smokeWisps[i].update();
                smokeWisps[i].draw(ctx);
                if (smokeWisps[i].life <= 0) {
                    smokeWisps.splice(i, 1);
                }
            }
            ctx.restore();

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
