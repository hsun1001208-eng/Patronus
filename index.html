<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Patronus</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#stage{position:fixed;inset:0;background:#000;overflow:hidden;touch-action:manipulation}
#p{
  position:absolute;width:220px;height:220px;opacity:0;pointer-events:none;
  background-image:url("./patronus-storyboard-sprite.png");
  background-size:1980px 220px;background-repeat:no-repeat;
  filter:drop-shadow(0 0 10px rgba(140,220,255,.85))
         drop-shadow(0 0 28px rgba(50,150,255,.38));
  will-change:transform,opacity,background-position;
}
#p.play{animation:swim .95s steps(9,end) infinite}
@keyframes swim{
  0%{background-position:0 0}
  100%{background-position:-1760px 0}
}
</style>
</head>
<body>
<div id="stage"><div id="p"></div></div>
<script>
const p=document.getElementById('p');
let busy=false, raf=0;
function pt(t,w,h){
  const inset=Math.max(125,Math.min(165,Math.min(w,h)*.15));
  const x0=inset,y0=inset,x1=w-inset,y1=h-inset,r=Math.max(45,Math.min(90,Math.min(w,h)*.11));
  const top=x1-x0-2*r, side=y1-y0-2*r, arc=Math.PI*r/2;
  const L=[top,arc,side,arc,top,arc,side,arc], total=L.reduce((a,b)=>a+b,0);
  let q=((t%1)+1)%1*total;
  for(let i=0;i<8;i++){
    if(q<=L[i]){
      const u=q/L[i]||0;
      if(i===0)return[x0+r+u*top,y0,0];
      if(i===1){let a=-Math.PI/2+u*Math.PI/2;return[x1-r+r*Math.cos(a),y0+r+r*Math.sin(a),a*180/Math.PI+90]}
      if(i===2)return[x1,y0+r+u*side,90];
      if(i===3){let a=u*Math.PI/2;return[x1-r+r*Math.cos(a),y1-r+r*Math.sin(a),a*180/Math.PI+90]}
      if(i===4)return[x1-r-u*top,y1,180];
      if(i===5){let a=Math.PI/2+u*Math.PI/2;return[x0+r+r*Math.cos(a),y1-r+r*Math.sin(a),a*180/Math.PI+90]}
      if(i===6)return[x0,y1-r-u*side,270];
      let a=Math.PI+u*Math.PI/2;return[x0+r+r*Math.cos(a),y0+r+r*Math.sin(a),a*180/Math.PI+90]
    }
    q-=L[i];
  }
}
function put(x,y,a,bob=0){
  p.style.transform=`translate3d(${x-110}px,${y-110+bob}px,0) rotate(${a}deg)`;
}
function summon(){
  if(busy)return; busy=true; p.classList.add('play'); p.style.opacity=1;
  const w=innerWidth,h=innerHeight,start=.37,dur=10500,begin=performance.now();
  function lap(now){
    const q=Math.min(1,(now-begin)/dur), z=pt(start-q,w,h);
    const bob=Math.sin(q*Math.PI*20)*4;
    put(z[0],z[1],z[2],bob);
    if(q<1)raf=requestAnimationFrame(lap);
    else exit(z);
  }
  raf=requestAnimationFrame(lap);
  function exit(from){
    const b=performance.now(),d=1200;
    function go(now){
      const q=Math.min(1,(now-b)/d),e=q*q*(3-2*q);
      put(from[0]+(-180-from[0])*e,from[1]+(-180-from[1])*e,-135,Math.sin(q*Math.PI*5)*3);
      p.style.opacity=1-e;
      if(q<1)raf=requestAnimationFrame(go);
      else{p.classList.remove('play');p.style.opacity=0;busy=false}
    }
    raf=requestAnimationFrame(go);
  }
}
document.addEventListener('pointerdown',summon,{passive:true});
</script>
</body>
</html>
