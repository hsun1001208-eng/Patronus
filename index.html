<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Patronus</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
  body{background:#000;touch-action:manipulation}
  #stage{position:fixed;inset:0;overflow:hidden;background:#000}
  #dolphin{
    position:absolute;left:0;top:0;width:360px;height:auto;
    pointer-events:none;user-select:none;opacity:0;
    transform-origin:50% 50%;
    will-change:transform,opacity;
    mix-blend-mode:screen;
  }
</style>
</head>
<body>
<div id="stage">
  <img id="dolphin" src="dolphin-swim.png" alt="">
</div>
<script>
(() => {
  const dolphin=document.getElementById('dolphin');
  let busy=false, raf=0;
  const TAU=Math.PI*2;
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

  function layout(){
    const w=innerWidth,h=innerHeight;
    // Keep the entire dolphin safely inside the viewport during the loop.
    const iw=Math.min(360,Math.max(220,w*0.28));
    dolphin.style.width=iw+'px';
    const ih=iw*420/600;
    const rx=Math.max(70,w/2-iw*0.70);
    const ry=Math.max(60,h/2-ih*0.70);
    return {w,h,iw,ih,rx,ry,cx:w/2,cy:h/2};
  }

  function frameAt(t,p,theta){
    const x=p.cx+p.rx*Math.cos(theta)-p.iw/2;
    const y=p.cy+p.ry*Math.sin(theta)-p.ih/2;
    const dx=-p.rx*Math.sin(theta), dy=p.ry*Math.cos(theta);
    const angle=Math.atan2(dy,dx)*180/Math.PI;
    dolphin.style.transform=`translate3d(${x}px,${y}px,0) rotate(${angle}deg)`;
  }

  function tween(a,b,duration,draw){
    return new Promise(resolve=>{
      const start=performance.now();
      function tick(now){
        const t=clamp((now-start)/duration,0,1);
        const e=t*t*(3-2*t);
        draw(a+(b-a)*e,t);
        if(t<1) raf=requestAnimationFrame(tick); else resolve();
      }
      raf=requestAnimationFrame(tick);
    });
  }

  async function summon(){
    if(busy)return;
    busy=true;
    const p=layout();
    const startTheta=Math.PI/4; // lower-right
    const startX=p.cx+p.rx*Math.cos(startTheta)-p.iw/2;
    const startY=p.cy+p.ry*Math.sin(startTheta)-p.ih/2;

    // Enter from the lower-right edge, then settle into the safe circular path.
    const enterX=p.w+p.iw*0.15;
    const enterY=p.h-p.ih*0.15;
    dolphin.style.opacity='0';
    dolphin.style.transform=`translate3d(${enterX}px,${enterY}px,0) rotate(35deg)`;
    await new Promise(r=>requestAnimationFrame(r));
    dolphin.style.opacity='1';
    await tween(0,1,650,(q)=>{
      const x=enterX+(startX-enterX)*q;
      const y=enterY+(startY-enterY)*q;
      dolphin.style.transform=`translate3d(${x}px,${y}px,0) rotate(145deg)`;
    });

    // Exactly one complete lap. The dolphin stays inside the screen for this entire lap.
    await tween(startTheta,startTheta+TAU,5200,(theta)=>frameAt(0,p,theta));

    // Move to the upper-left INSIDE the screen first.
    const exitTheta=5*Math.PI/4;
    await tween(0,1,900,(q)=>{
      const ease=q*q*(3-2*q);
      const x=p.cx+p.rx*Math.cos(startTheta+TAU)+(p.cx-p.rx*0.55-(p.cx+p.rx*Math.cos(startTheta)))*ease-p.iw/2;
      const y=p.cy+p.ry*Math.sin(startTheta+TAU)+(p.cy-p.ry*0.55-(p.cy+p.ry*Math.sin(startTheta)))*ease-p.ih/2;
      dolphin.style.transform=`translate3d(${x}px,${y}px,0) rotate(-135deg)`;
    });

    // Only now leave through the upper-left corner.
    const insideX=p.cx-p.rx*0.55-p.iw/2;
    const insideY=p.cy-p.ry*0.55-p.ih/2;
    await tween(0,1,850,(q)=>{
      const x=insideX+(-p.iw*1.1-insideX)*q;
      const y=insideY+(-p.ih*1.1-insideY)*q;
      dolphin.style.transform=`translate3d(${x}px,${y}px,0) rotate(-145deg)`;
      dolphin.style.opacity=String(1-q);
    });
    dolphin.style.opacity='0';
    busy=false;
  }

  addEventListener('pointerdown',summon,{passive:true});
  addEventListener('resize',()=>{if(!busy)layout()},{passive:true});
})();
</script>
</body>
</html>
