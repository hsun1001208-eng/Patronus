<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patronus Dolphin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            background-color: #000000;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Dynamic Edge Smoke Particles
        const edgeSmokeParticles = [];

        class EdgeSmoke {
            constructor(x, y, angle, speed) {
                this.x = x;
                this.y = y;
                // Drift slightly outward/backward
                const spreadAngle = angle + Math.PI + (Math.random() - 0.5) * 1.5;
                this.vx = Math.cos(spreadAngle) * speed + (Math.random() - 0.5) * 1.2;
                this.vy = Math.sin(spreadAngle) * speed + (Math.random() - 0.5) * 1.2;
                this.radius = Math.random() * 18 + 12;
                this.life = Math.random() * 25 + 15;
                this.maxLife = this.life;
                this.rot = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 0.08;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.94;
                this.vy *= 0.94;
                this.radius += 0.6;
                this.rot += this.vRot;
                this.life--;
            }

            draw(ctx) {
                if (this.life <= 0) return;
                const alpha = Math.sin((this.life / this.maxLife) * Math.PI);

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rot);

                const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius);
                grad.addColorStop(0, `rgba(200, 240, 255, ${alpha * 0.35})`);
                grad.addColorStop(0.4, `rgba(100, 210, 255, ${alpha * 0.18})`);
                grad.addColorStop(0.8, `rgba(20, 120, 230, ${alpha * 0.05})`);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Spine deformation for Swimming Wave
        function getSpineY(x, time) {
            const swimFreq = 12.0;
            const norm = (180 - x) / 360;
            if (norm < 0.2) return Math.sin(norm * Math.PI) * 2.0;
            const flexFactor = Math.pow((norm - 0.2) / 0.8, 1.85);
            return Math.sin(time * swimFreq - norm * 3.6) * 40 * flexFactor;
        }

        // Generate points along perimeter for smoke emission
        function getDolphinPerimeterPoints(time, scale = 1.0) {
            const pts = [];
            const snoutY = getSpineY(185 * scale, time);
            pts.push({ x: 185 * scale, y: snoutY });

            // Upper body points
            pts.push({ x: 152 * scale, y: getSpineY(152 * scale, time) + 8 * scale });
            pts.push({ x: 68 * scale, y: getSpineY(68 * scale, time) + 40 * scale });

            // Dorsal Fin
            const dBaseY = getSpineY(14 * scale, time);
            pts.push({ x: 20 * scale, y: dBaseY + 37 * scale });
            pts.push({ x: -30 * scale, y: dBaseY + 86 * scale });
            pts.push({ x: -24 * scale, y: dBaseY + 32 * scale });

            // Back to Tail
            pts.push({ x: -145 * scale, y: getSpineY(-145 * scale, time) + 8 * scale });

            // Tail Fluke
            const tailY = getSpineY(-178 * scale, time);
            pts.push({ x: -172 * scale, y: tailY + 42 * scale });
            pts.push({ x: -175 * scale, y: tailY });
            pts.push({ x: -172 * scale, y: tailY - 42 * scale });

            // Lower body
            pts.push({ x: -145 * scale, y: getSpineY(-145 * scale, time) - 8 * scale });

            // Pectoral Flipper
            const pBaseY = getSpineY(33 * scale, time);
            pts.push({ x: 26 * scale, y: pBaseY - 29 * scale });
            pts.push({ x: -29 * scale, y: pBaseY - 78 * scale });
            pts.push({ x: 46 * scale, y: pBaseY - 24 * scale });

            pts.push({ x: 152 * scale, y: getSpineY(152 * scale, time) - 5 * scale });
            return pts;
        }

        // Draw solid dolphin body mesh
        function drawDolphinMesh(ctx, time, scale = 1.0) {
            ctx.beginPath();

            const snoutY = getSpineY(185 * scale, time);
            ctx.moveTo(185 * scale, snoutY);

            // --- Upper Body ---
            ctx.quadraticCurveTo(165 * scale, getSpineY(165 * scale, time) + 3 * scale, 152 * scale, getSpineY(152 * scale, time) + 8 * scale);
            ctx.quadraticCurveTo(120 * scale, getSpineY(120 * scale, time) + 37 * scale, 68 * scale, getSpineY(68 * scale, time) + 40 * scale);

            // Dorsal Fin
            const dBaseY = getSpineY(14 * scale, time);
            ctx.lineTo(20 * scale, dBaseY + 37 * scale);
            ctx.quadraticCurveTo(-7 * scale, dBaseY + 82 * scale, -30 * scale, dBaseY + 86 * scale);
            ctx.quadraticCurveTo(-20 * scale, dBaseY + 53 * scale, -24 * scale, dBaseY + 32 * scale);

            // Back -> Tail
            ctx.quadraticCurveTo(-80 * scale, getSpineY(-80 * scale, time) + 21 * scale, -145 * scale, getSpineY(-145 * scale, time) + 8 * scale);

            // Tail Fluke
            const tailY = getSpineY(-178 * scale, time);
            ctx.lineTo(-172 * scale, tailY + 42 * scale);
            ctx.quadraticCurveTo(-182 * scale, tailY + 21 * scale, -175 * scale, tailY);
            ctx.quadraticCurveTo(-182 * scale, tailY - 21 * scale, -172 * scale, tailY - 42 * scale);

            // --- Lower Body ---
            ctx.lineTo(-145 * scale, getSpineY(-145 * scale, time) - 8 * scale);
            ctx.quadraticCurveTo(-80 * scale, getSpineY(-80 * scale, time) - 21 * scale, -26 * scale, getSpineY(-26 * scale, time) - 29 * scale);

            // Pectoral Flipper
            const pBaseY = getSpineY(33 * scale, time);
            ctx.lineTo(26 * scale, pBaseY - 29 * scale);
            ctx.quadraticCurveTo(-3 * scale, pBaseY - 72 * scale, -29 * scale, pBaseY - 78 * scale);
            ctx.quadraticCurveTo(-13 * scale, pBaseY - 48 * scale, 46 * scale, pBaseY - 24 * scale);

            // Belly -> Snout
            ctx.quadraticCurveTo(106 * scale, getSpineY(106 * scale, time) - 16 * scale, 152 * scale, getSpineY(152 * scale, time) - 5 * scale);
            ctx.lineTo(185 * scale, snoutY);
            ctx.closePath();
        }

        function drawOrganicSmokyPatronus(ctx, time, pos) {
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(pos.angle);

            ctx.globalCompositeOperation = 'lighter';

            // --- 1. Core Solid Body (Solid shape in center) ---
            ctx.save();
            drawDolphinMesh(ctx, time, 1.0);
            const coreGrad = ctx.createLinearGradient(185, 0, -178, 0);
            coreGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
            coreGrad.addColorStop(0.3, 'rgba(200, 245, 255, 0.85)');
            coreGrad.addColorStop(0.7, 'rgba(70, 185, 255, 0.60)');
            coreGrad.addColorStop(1, 'rgba(15, 100, 220, 0.30)');
            ctx.fillStyle = coreGrad;
            ctx.fill();
            ctx.restore();

            // --- 2. Emit Smoke Particles directly on Perimeter Edges ---
            const cos = Math.cos(pos.angle);
            const sin = Math.sin(pos.angle);
            const pts = getDolphinPerimeterPoints(time, 1.0);

            for (let i = 0; i < pts.length; i++) {
                const pt = pts[i];
                // Convert local coords to world coords
                const worldX = pos.x + (pt.x * cos - pt.y * sin);
                const worldY = pos.y + (pt.x * sin + pt.y * cos);

                // Spawn edge smoke
                for (let k = 0; k < 2; k++) {
                    edgeSmokeParticles.push(new EdgeSmoke(
                        worldX + (Math.random() - 0.5) * 8,
                        worldY + (Math.random() - 0.5) * 8,
                        pos.angle,
                        Math.random() * 2 + 1
                    ));
                }
            }

            ctx.restore();
        }

        let isAnimating = false;
        let animProgress = 0;
        let time = 0;
        const duration = 2.5;

        function triggerPatronus() {
            if (isAnimating) return;
            isAnimating = true;
            animProgress = 0;
        }

        window.addEventListener('click', triggerPatronus);
        window.addEventListener('pointerdown', triggerPatronus);
        window.addEventListener('touchstart', triggerPatronus, { passive: true });

        function getPathPos(t) {
            const startX = width + 280;
            const startY = height + 280;
            const endX = -350;
            const endY = -350;

            const x = startX + (endX - startX) * t + Math.sin(t * Math.PI) * 160;
            const y = startY + (endY - startY) * t - Math.sin(t * Math.PI) * 110;

            const dt = 0.005;
            const nextX = startX + (endX - startX) * (t + dt) + Math.sin((t + dt) * Math.PI) * 160;
            const nextY = startY + (endY - startY) * (t + dt) - Math.sin((t + dt) * Math.PI) * 110;

            const angle = Math.atan2(nextY - y, nextX - x);

            return { x, y, angle };
        }

        const clockStep = 1 / 60;

        function render() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            time += clockStep;

            if (isAnimating) {
                animProgress += clockStep / duration;

                if (animProgress <= 1.0) {
                    const pos = getPathPos(animProgress);
                    drawOrganicSmokyPatronus(ctx, time, pos);
                } else {
                    isAnimating = false;
                }
            }

            // Render edge smoke particles
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (let i = edgeSmokeParticles.length - 1; i >= 0; i--) {
                edgeSmokeParticles[i].update();
                edgeSmokeParticles[i].draw(ctx);
                if (edgeSmokeParticles[i].life <= 0) {
                    edgeSmokeParticles.splice(i, 1);
                }
            }
            ctx.restore();

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
