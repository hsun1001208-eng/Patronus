<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patronus Dolphin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            background-color: #000000;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="webgl"></canvas>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- Scene & Renderer Setup ---
        const canvas = document.getElementById('webgl');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 50);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x000000, 1);

        // --- Custom Shaders for Patronus Dolphin ---
        const patronusVertexShader = `
            uniform float uTime;
            uniform float uSwimSpeed;
            uniform float uFlexibility;
            
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            varying vec3 vWorldPosition;
            
            void main() {
                vNormal = normalize(normalMatrix * normal);
                
                // Dolphin Swimming Undulation Effect (Sine Wave along Z axis)
                vec3 pos = position;
                float wave = sin(uTime * uSwimSpeed - pos.z * uFlexibility) * 1.2;
                pos.x += wave * (pos.z < 0.0 ? 0.8 : 0.2); // Fluke/Tail moves more
                
                vec4 worldPosition = modelMatrix * vec4(pos, 1.0);
                vWorldPosition = worldPosition.xyz;
                
                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                vViewPosition = -mvPosition.xyz;
                
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const patronusFragmentShader = `
            uniform float uTime;
            uniform float uOpacity;
            
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            varying vec3 vWorldPosition;

            // Simple Perlin-like Noise function
            float hash(float n) { return fract(sin(n) * 43758.5453123); }
            float noise(vec3 x) {
                vec3 p = floor(x);
                vec3 f = fract(x);
                f = f*f*(3.0-2.0*f);
                float n = p.x + p.y*57.0 + 113.0*p.z;
                return mix(mix(mix(hash(n+0.0), hash(n+1.0),f.x),
                               mix(hash(n+57.0), hash(n+58.0),f.x),f.y),
                           mix(mix(hash(n+113.0), hash(n+114.0),f.x),
                               mix(hash(n+170.0), hash(n+171.0),f.x),f.y),f.z);
            }

            void main() {
                vec3 normal = normalize(vNormal);
                vec3 viewDir = normalize(vViewPosition);

                // Fresnel Effect (Glowing Outline)
                float fresnel = pow(1.0 - abs(dot(normal, viewDir)), 2.5);

                // Wispy Smoke Noise Pattern
                vec3 noiseCoords = vWorldPosition * 0.15 + vec3(0.0, uTime * 0.8, uTime * 0.5);
                float n = noise(noiseCoords);
                float smokeEffect = smoothstep(0.1, 0.9, n);

                // Harry Potter Silver-Blue Glow Colors
                vec3 coreColor = vec3(0.4, 0.75, 1.0); // Bright magical blue
                vec3 edgeColor = vec3(0.85, 0.95, 1.0); // Silver white
                vec3 deepColor = vec3(0.1, 0.3, 0.7);  // Deep mystic blue

                vec3 finalColor = mix(coreColor, edgeColor, fresnel);
                finalColor += deepColor * smokeEffect * 0.5;
                finalColor += vec3(fresnel * 1.5); // Highlight edge glow

                float alpha = (fresnel * 0.8 + smokeEffect * 0.4 + 0.2) * uOpacity;
                
                gl_FragColor = vec4(finalColor, clamp(alpha, 0.0, 1.0));
            }
        `;

        // --- Procedural Dolphin Mesh Creation ---
        function createDolphinGeometry() {
            const geometry = new THREE.BufferGeometry();
            const segsRadial = 16;
            const segsLength = 32;
            const points = [];

            // Body profile curve along Z axis (-10 to 10)
            function getRadius(z) {
                // Nose at +10, Tail Fluke at -10
                if (z > 8.0) return (10.0 - z) * 0.25; // Snout
                if (z > 2.0) return 0.5 + (8.0 - z) * 0.35; // Head to body
                if (z > -6.0) return 2.6 * Math.cos(((z - 2.0) / 8.0) * (Math.PI / 2.0)); // Torso
                if (z > -9.0) return 0.4 + (z + 9.0) * 0.3; // Tail stock
                return 0.2; // Fluke base
            }

            const vertices = [];
            const indices = [];

            for (let i = 0; i <= segsLength; i++) {
                const z = 10.0 - (i / segsLength) * 20.0;
                const radius = getRadius(z);

                for (let j = 0; j <= segsRadial; j++) {
                    const theta = (j / segsRadial) * Math.PI * 2;
                    let x = Math.cos(theta) * radius;
                    let y = Math.sin(theta) * radius * 1.1; // Slightly flattened laterally

                    // Dorsal Fin protrusion around z = 0
                    if (z > -2.0 && z < 3.0 && theta > Math.PI * 0.3 && theta < Math.PI * 0.7) {
                        const finHeight = Math.sin((z + 2.0) / 5.0 * Math.PI) * 1.8 * Math.sin((theta - Math.PI*0.3)/(Math.PI*0.4)*Math.PI);
                        y += finHeight;
                    }

                    // Fluke (Horizontal Tail Fin) around z = -9 to -10
                    if (z <= -8.5) {
                        const flukeFactor = ( -8.5 - z ) / 1.5;
                        x *= (1.0 + flukeFactor * 4.5); // Spread wide
                        y *= (1.0 - flukeFactor * 0.7); // Flatten height
                    }

                    vertices.push(x, y, z);
                }
            }

            for (let i = 0; i < segsLength; i++) {
                for (let j = 0; j < segsRadial; j++) {
                    const first = (i * (segsRadial + 1)) + j;
                    const second = first + segsRadial + 1;

                    indices.push(first, second, first + 1);
                    indices.push(second, second + 1, first + 1);
                }
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setIndex(indices);
            geometry.computeVertexNormals();

            return geometry;
        }

        // --- Create Patronus Dolphin Object ---
        const patronusMaterial = new THREE.ShaderMaterial({
            vertexShader: patronusVertexShader,
            fragmentShader: patronusFragmentShader,
            uniforms: {
                uTime: { value: 0 },
                uSwimSpeed: { value: 6.0 },
                uFlexibility: { value: 0.25 },
                uOpacity: { value: 1.0 }
            },
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide
        });

        const dolphinMesh = new THREE.Mesh(createDolphinGeometry(), patronusMaterial);
        
        // Group for rotation and position
        const dolphinGroup = new THREE.Group();
        dolphinGroup.add(dolphinMesh);
        scene.add(dolphinGroup);
        dolphinGroup.visible = false;

        // --- Particle Trail System (Mist / Sparks) ---
        const particleCount = 200;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleAlphas = new Float32Array(particleCount);
        const particleSizes = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            particlePositions[i * 3] = 9999; // Hide offscreen
            particlePositions[i * 3 + 1] = 9999;
            particlePositions[i * 3 + 2] = 9999;
            particleAlphas[i] = 0.0;
            particleSizes[i] = Math.random() * 2.5 + 1.0;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particleGeo.setAttribute('alpha', new THREE.BufferAttribute(particleAlphas, 1));

        // Particle Shader
        const particleMat = new THREE.ShaderMaterial({
            uniforms: {
                color: { value: new THREE.Color(0x88ccff) }
            },
            vertexShader: `
                attribute float alpha;
                varying float vAlpha;
                void main() {
                    vAlpha = alpha;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = (12.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform vec3 color;
                varying float vAlpha;
                void main() {
                    float dist = length(gl_PointCoord - vec2(0.5));
                    if (dist > 0.5) discard;
                    float glow = pow(1.0 - dist * 2.0, 2.0);
                    gl_FragColor = vec4(color, vAlpha * glow);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);

        let particleIndex = 0;
        function emitParticle(pos) {
            const idx = particleIndex % particleCount;
            particlePositions[idx * 3] = pos.x + (Math.random() - 0.5) * 1.5;
            particlePositions[idx * 3 + 1] = pos.y + (Math.random() - 0.5) * 1.5;
            particlePositions[idx * 3 + 2] = pos.z + (Math.random() - 0.5) * 1.5;
            particleAlphas[idx] = 0.8;
            particleIndex++;
            particleGeo.attributes.position.needsUpdate = true;
            particleGeo.attributes.alpha.needsUpdate = true;
        }

        function updateParticles() {
            const alphas = particleGeo.attributes.alpha.array;
            for (let i = 0; i < particleCount; i++) {
                if (alphas[i] > 0) {
                    alphas[i] -= 0.012; // Fade out
                    if (alphas[i] < 0) alphas[i] = 0;
                }
            }
            particleGeo.attributes.alpha.needsUpdate = true;
        }

        // --- Animation Path Logic (Curve from Right-Bottom to Left-Top) ---
        // Right-Bottom entry: approx (35, -25, -10)
        // Mid arc center: approx (0, 5, 10)
        // Left-Top exit: approx (-35, 25, -10)
        const curve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(40, -30, -15),
            new THREE.Vector3(25, -15, 5),
            new THREE.Vector3(0, 5, 15),
            new THREE.Vector3(-20, 18, 5),
            new THREE.Vector3(-45, 32, -15)
        ]);

        let isAnimating = false;
        let animProgress = 0;
        const animDuration = 4.5; // Seconds for full swim loop

        function triggerPatronus() {
            if (isAnimating) return; // Prevent restart mid-animation
            isAnimating = true;
            animProgress = 0;
            dolphinGroup.visible = true;
            patronusMaterial.uniforms.uOpacity.value = 1.0;
        }

        // Click Event listener anywhere on the page
        window.addEventListener('click', triggerPatronus);
        window.addEventListener('touchstart', triggerPatronus, { passive: true });

        // Window resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Render Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            patronusMaterial.uniforms.uTime.value = time;

            if (isAnimating) {
                animProgress += delta / animDuration;

                if (animProgress <= 1.0) {
                    // Current Position along curve
                    const point = curve.getPoint(animProgress);
                    dolphinGroup.position.copy(point);

                    // Orientation along curve tangent
                    const tangent = curve.getTangent(animProgress).normalize();
                    const targetLookAt = point.clone().add(tangent);
                    dolphinGroup.lookAt(targetLookAt);

                    // Add dynamic banking/roll on curves
                    const bankAngle = Math.sin(animProgress * Math.PI * 2) * 0.35;
                    dolphinGroup.rotateZ(bankAngle);

                    // Emit ethereal magical trail particles from dolphin tail
                    const tailPos = point.clone().sub(tangent.multiplyScalar(6));
                    emitParticle(tailPos);

                    // Fade out smoothly towards the end
                    if (animProgress > 0.85) {
                        patronusMaterial.uniforms.uOpacity.value = (1.0 - animProgress) / 0.15;
                    }
                } else {
                    isAnimating = false;
                    dolphinGroup.visible = false;
                }
            }

            updateParticles();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
