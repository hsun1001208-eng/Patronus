<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patronus Dolphin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            background-color: #000000;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Smoke Wisps Trail Class
        const smokePuffs = [];

        class SmokePuff {
            constructor(x, y, vx, vy, rx, ry, angle, maxLife) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.rx = rx;
                this.ry = ry;
                this.angle = angle;
                this.life = maxLife;
                this.maxLife = maxLife;
                this.vRot = (Math.random() - 0.5) * 0.04;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.rx += 0.8;
                this.ry += 0.7;
                this.angle += this.vRot;
                this.life--;
            }

            draw(ctx) {
                if (this.life <= 0) return;
                const alpha = Math.sin((this.life / this.maxLife) * Math.PI);

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.rx);
                grad.addColorStop(0, `rgba(210, 245, 255, ${alpha * 0.25})`);
                grad.addColorStop(0.4, `rgba(100, 200, 255, ${alpha * 0.15})`);
                grad.addColorStop(0.8, `rgba(30, 110, 220, ${alpha * 0.04})`);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.rx, this.ry, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Spine deformation for Swimming Wave
        function getSpineY(x, time) {
            const swimFreq = 12.0;
            const norm = (180 - x) / 360;
            if (norm < 0.2) return Math.sin(norm * Math.PI) * 2.0;
            const flexFactor = Math.pow((norm - 0.2) / 0.8, 1.85);
            return Math.sin(time * swimFreq - norm * 3.6) * 40 * flexFactor;
        }

        // Correct Anatomy (Scaled Size): 背朝上(Up), 腹朝下(Down)
        function drawDolphinMesh(ctx, time, scale = 1.0) {
            ctx.beginPath();

            const snoutY = getSpineY(185 * scale, time);
            ctx.moveTo(185 * scale, snoutY);

            // --- 1. 上半身：吻部 -> 額頭 -> 背部 -> 背鰭 (UPWARD / Positive -Y) ---
            ctx.quadraticCurveTo(165 * scale, getSpineY(165 * scale, time) + 3 * scale, 152 * scale, getSpineY(152 * scale, time) + 8 * scale);
            ctx.quadraticCurveTo(120 * scale, getSpineY(120 * scale, time) + 37 * scale, 68 * scale, getSpineY(68 * scale, time) + 40 * scale);

            // 背鰭 (Dorsal Fin)
            const dBaseY = getSpineY(14 * scale, time);
            ctx.lineTo(20 * scale, dBaseY + 37 * scale);
            ctx.quadraticCurveTo(-7 * scale, dBaseY + 82 * scale, -30 * scale, dBaseY + 86 * scale);
            ctx.quadraticCurveTo(-20 * scale, dBaseY + 53 * scale, -24 * scale, dBaseY + 32 * scale);

            // 背部後段 -> 尾柄上緣
            ctx.quadraticCurveTo(-80 * scale, getSpineY(-80 * scale, time) + 21 * scale, -145 * scale, getSpineY(-145 * scale, time) + 8 * scale);

            // 雙葉尾鰭 (Tail Fluke)
            const tailY = getSpineY(-178 * scale, time);
            ctx.lineTo(-172 * scale, tailY + 42 * scale);
            ctx.quadraticCurveTo(-182 * scale, tailY + 21 * scale, -175 * scale, tailY);
            ctx.quadraticCurveTo(-182 * scale, tailY - 21 * scale, -172 * scale, tailY - 42 * scale);

            // --- 2. 下半身：尾柄下緣 -> 腹部 -> 胸鰭 -> 下巴 (DOWNWARD / Positive +Y) ---
            ctx.lineTo(-145 * scale, getSpineY(-145 * scale, time) - 8 * scale);
            ctx.quadraticCurveTo(-80 * scale, getSpineY(-80 * scale, time) - 21 * scale, -26 * scale, getSpineY(-26 * scale, time) - 29 * scale);

            // 胸鰭 (Pectoral Flipper)
            const pBaseY = getSpineY(33 * scale, time);
            ctx.lineTo(26 * scale, pBaseY - 29 * scale);
            ctx.quadraticCurveTo(-3 * scale, pBaseY - 72 * scale, -29 * scale, pBaseY - 78 * scale);
            ctx.quadraticCurveTo(-13 * scale, pBaseY - 48 * scale, 46 * scale, pBaseY - 24 * scale);

            // 腹部 -> 下巴 -> 吻部
            ctx.quadraticCurveTo(106 * scale, getSpineY(106 * scale, time) - 16 * scale, 152 * scale, getSpineY(152 * scale, time) - 5 * scale);
            ctx.lineTo(185 * scale, snoutY);
            ctx.closePath();
        }

        function drawSmokyPatronus(ctx, time, pos) {
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(pos.angle);

            ctx.globalCompositeOperation = 'lighter';

            // --- Layer 1: 最外層大範圍超羽化煙霧 (Outer Smokey Feather Aura, blur 50px) ---
            ctx.save();
            if (ctx.filter !== undefined) ctx.filter = 'blur(50px)';
            ctx.shadowColor = '#60d0ff';
            ctx.shadowBlur = 45;
            
            drawDolphinMesh(ctx, time, 1.25);
            const outerGrad = ctx.createLinearGradient(185, 0, -178, 0);
            outerGrad.addColorStop(0, 'rgba(230, 250, 255, 0.45)');
            outerGrad.addColorStop(0.3, 'rgba(110, 205, 255, 0.28)');
            outerGrad.addColorStop(0.7, 'rgba(25, 130, 225, 0.12)');
            outerGrad.addColorStop(1, 'rgba(0, 50, 170, 0.02)');
            ctx.fillStyle = outerGrad;
            ctx.fill();
            ctx.restore();

            // --- Layer 2: 外緣半透明雲霧漸變 (Outer Edge Fuzzy Fog, blur 30px) ---
            ctx.save();
            if (ctx.filter !== undefined) ctx.filter = 'blur(30px)';

            drawDolphinMesh(ctx, time, 1.12);
            const edgeGrad = ctx.createLinearGradient(185, 0, -178, 0);
            edgeGrad.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
            edgeGrad.addColorStop(0.35, 'rgba(160, 225, 255, 0.35)');
            edgeGrad.addColorStop(0.75, 'rgba(50, 160, 245, 0.18)');
            edgeGrad.addColorStop(1, 'rgba(10, 80, 200, 0.05)');
            ctx.fillStyle = edgeGrad;
            ctx.fill();
            ctx.restore();

            // --- Layer 3: 中間清晰身體（微柔化 blur 6px，保持內部清晰形體，但無硬邊） ---
            ctx.save();
            if (ctx.filter !== undefined) ctx.filter = 'blur(6px)';

            drawDolphinMesh(ctx, time, 0.98);
            const coreGrad = ctx.createLinearGradient(185, 0, -178, 0);
            coreGrad.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
            coreGrad.addColorStop(0.25, 'rgba(210, 245, 255, 0.65)');
            coreGrad.addColorStop(0.6, 'rgba(90, 195, 255, 0.40)');
            coreGrad.addColorStop(1, 'rgba(20, 120, 230, 0.15)');
            ctx.fillStyle = coreGrad;
            ctx.fill();
            ctx.restore();

            // --- Layer 4: 拖尾流體蒸氣 (Trailing Vapor Wisps) ---
            const cos = Math.cos(pos.angle);
            const sin = Math.sin(pos.angle);

            const tailY = getSpineY(-178, time);
            for (let k = 0; k < 6; k++) {
                const tWy = tailY + (Math.random() - 0.5) * 40;
                const wx = pos.x + (-170 * cos - tWy * sin);
                const wy = pos.y + (-170 * sin + tWy * cos);

                smokePuffs.push(new SmokePuff(
                    wx, wy,
                    -cos * (Math.random() * 5 + 2.5) + (Math.random() - 0.5) * 2,
                    -sin * (Math.random() * 5 + 2.5) + (Math.random() - 0.5) * 2,
                    Math.random() * 38 + 25,
                    Math.random() * 30 + 18,
                    Math.random() * Math.PI * 2,
                    Math.random() * 40 + 28
                ));
            }

            ctx.restore();
        }

        let isAnimating = false;
        let animProgress = 0;
        let time = 0;
        const duration = 2.5;

        function triggerPatronus() {
            if (isAnimating) return;
            isAnimating = true;
            animProgress = 0;
        }

        window.addEventListener('click', triggerPatronus);
        window.addEventListener('pointerdown', triggerPatronus);
        window.addEventListener('touchstart', triggerPatronus, { passive: true });

        function getPathPos(t) {
            const startX = width + 280;
            const startY = height + 280;
            const endX = -350;
            const endY = -350;

            const x = startX + (endX - startX) * t + Math.sin(t * Math.PI) * 160;
            const y = startY + (endY - startY) * t - Math.sin(t * Math.PI) * 110;

            const dt = 0.005;
            const nextX = startX + (endX - startX) * (t + dt) + Math.sin((t + dt) * Math.PI) * 160;
            const nextY = startY + (endY - startY) * (t + dt) - Math.sin((t + dt) * Math.PI) * 110;

            const angle = Math.atan2(nextY - y, nextX - x);

            return { x, y, angle };
        }

        const clockStep = 1 / 60;

        function render() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            time += clockStep;

            if (isAnimating) {
                animProgress += clockStep / duration;

                if (animProgress <= 1.0) {
                    const pos = getPathPos(animProgress);
                    drawSmokyPatronus(ctx, time, pos);
                } else {
                    isAnimating = false;
                }
            }

            // Render ambient smoke trail
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            if (ctx.filter !== undefined) ctx.filter = 'blur(16px)';

            for (let i = smokePuffs.length - 1; i >= 0; i--) {
                smokePuffs[i].update();
                smokePuffs[i].draw(ctx);
                if (smokePuffs[i].life <= 0) {
                    smokePuffs.splice(i, 1);
                }
            }
            ctx.restore();

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
