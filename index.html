<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patronus Dolphin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            background-color: #000000;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Smoke Wisps Trail Class (Continuous Smoky Clouds, Not Dots!)
        const smokePuffs = [];

        class SmokePuff {
            constructor(x, y, vx, vy, rx, ry, angle, maxLife) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.rx = rx;
                this.ry = ry;
                this.angle = angle;
                this.life = maxLife;
                this.maxLife = maxLife;
                this.vRot = (Math.random() - 0.5) * 0.04;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.rx += 0.5;
                this.ry += 0.4;
                this.angle += this.vRot;
                this.life--;
            }

            draw(ctx) {
                if (this.life <= 0) return;
                const alpha = Math.sin((this.life / this.maxLife) * Math.PI);

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Organic Cloud Puff Path
                const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.rx);
                grad.addColorStop(0, `rgba(220, 245, 255, ${alpha * 0.35})`);
                grad.addColorStop(0.4, `rgba(100, 200, 255, ${alpha * 0.18})`);
                grad.addColorStop(0.8, `rgba(30, 110, 220, ${alpha * 0.05})`);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.rx, this.ry, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Spine deformation for Swimming Wave
        function getSpineY(x, time) {
            const swimFreq = 13.0;
            const norm = (140 - x) / 280;
            if (norm < 0.2) return Math.sin(norm * Math.PI) * 1.5;
            const flexFactor = Math.pow((norm - 0.2) / 0.8, 1.85);
            return Math.sin(time * swimFreq - norm * 3.6) * 32 * flexFactor;
        }

        // Draw Complete Seamless Dolphin Shape
        function drawDolphinMesh(ctx, time, isCore = false) {
            ctx.beginPath();

            const snoutY = getSpineY(140, time);
            ctx.moveTo(140, snoutY);

            // Beak to Melon (圓潤額頭)
            ctx.quadraticCurveTo(125, getSpineY(125, time) - 2, 115, getSpineY(115, time) - 6);
            ctx.quadraticCurveTo(90, getSpineY(90, time) - 28, 50, getSpineY(50, time) - 30);

            // Back to Dorsal Fin (彎曲背鰭)
            const dBaseY = getSpineY(10, time);
            ctx.lineTo(15, dBaseY - 28);
            ctx.quadraticCurveTo(-5, dBaseY - 62, -22, dBaseY - 65);
            ctx.quadraticCurveTo(-15, dBaseY - 40, -18, dBaseY - 24);

            // Back to Tail Peduncle
            ctx.quadraticCurveTo(-60, getSpineY(-60, time) - 16, -110, getSpineY(-110, time) - 6);

            // Tail Fluke (雙葉尾鰭)
            const tailY = getSpineY(-135, time);
            ctx.lineTo(-130, tailY - 32);
            ctx.quadraticCurveTo(-138, tailY - 16, -132, tailY);
            ctx.quadraticCurveTo(-138, tailY + 16, -130, tailY + 32);

            // Lower Peduncle to Belly
            ctx.lineTo(-110, getSpineY(-110, time) + 6);
            ctx.quadraticCurveTo(-60, getSpineY(-60, time) + 16, -20, getSpineY(-20, time) + 22);

            // Pectoral Flipper (優雅胸鰭)
            const pBaseY = getSpineY(25, time);
            ctx.lineTo(20, pBaseY + 22);
            ctx.quadraticCurveTo(-2, pBaseY + 54, -22, pBaseY + 58);
            ctx.quadraticCurveTo(-10, pBaseY + 36, 35, pBaseY + 18);

            // Chin to Snout
            ctx.quadraticCurveTo(80, getSpineY(80, time) + 12, 115, getSpineY(115, time) + 4);
            ctx.lineTo(140, snoutY);
            ctx.closePath();
        }

        function drawSmokyPatronus(ctx, time, pos) {
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(pos.angle);

            ctx.globalCompositeOperation = 'lighter';

            // --- Pass 1: Heavy Outer Vaporous Fog (濃郁擴散光霧) ---
            ctx.save();
            if (ctx.filter !== undefined) ctx.filter = 'blur(18px)';
            
            drawDolphinMesh(ctx, time);
            const outerGrad = ctx.createLinearGradient(140, 0, -135, 0);
            outerGrad.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
            outerGrad.addColorStop(0.3, 'rgba(180, 230, 255, 0.5)');
            outerGrad.addColorStop(0.7, 'rgba(50, 160, 245, 0.3)');
            outerGrad.addColorStop(1, 'rgba(5, 80, 200, 0.1)');
            ctx.fillStyle = outerGrad;
            ctx.fill();
            ctx.restore();

            // --- Pass 2: Mid-Layer Soft Smoke Body (中層煙霧形體) ---
            ctx.save();
            if (ctx.filter !== undefined) ctx.filter = 'blur(8px)';

            drawDolphinMesh(ctx, time);
            const midGrad = ctx.createLinearGradient(140, 0, -135, 0);
            midGrad.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
            midGrad.addColorStop(0.35, 'rgba(215, 245, 255, 0.65)');
            midGrad.addColorStop(0.75, 'rgba(100, 205, 255, 0.35)');
            midGrad.addColorStop(1, 'rgba(14, 130, 230, 0.15)');
            ctx.fillStyle = midGrad;
            ctx.fill();
            ctx.restore();

            // --- Pass 3: Core Luminous Spirit Density (核心銀白靈氣) ---
            ctx.save();
            if (ctx.filter !== undefined) ctx.filter = 'blur(3px)';

            drawDolphinMesh(ctx, time);
            const coreGrad = ctx.createLinearGradient(140, 0, -135, 0);
            coreGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
            coreGrad.addColorStop(0.25, 'rgba(240, 250, 255, 0.8)');
            coreGrad.addColorStop(0.6, 'rgba(160, 225, 255, 0.45)');
            coreGrad.addColorStop(1, 'rgba(50, 170, 240, 0.1)');
            ctx.fillStyle = coreGrad;
            ctx.fill();
            ctx.restore();

            // --- Pass 4: Continuous Swirling Smoky Tendrils / Trails (後方拖尾蒸氣煙霧) ---
            const cos = Math.cos(pos.angle);
            const sin = Math.sin(pos.angle);

            // Tail Fluke Smoke Release
            const tailY = getSpineY(-135, time);
            for (let k = 0; k < 5; k++) {
                const tWy = tailY + (Math.random() - 0.5) * 24;
                const wx = pos.x + (-130 * cos - tWy * sin);
                const wy = pos.y + (-130 * sin + tWy * cos);

                smokePuffs.push(new SmokePuff(
                    wx, wy,
                    -cos * (Math.random() * 5 + 3) + (Math.random() - 0.5) * 2,
                    -sin * (Math.random() * 5 + 3) + (Math.random() - 0.5) * 2,
                    Math.random() * 25 + 18,
                    Math.random() * 20 + 12,
                    Math.random() * Math.PI * 2,
                    Math.random() * 35 + 25
                ));
            }

            // Dorsal & Pectoral Smoke Release
            if (Math.random() < 0.7) {
                const bodyX = (Math.random() - 0.5) * 200;
                const bodyY = getSpineY(bodyX, time) + (Math.random() - 0.5) * 20;
                const wx = pos.x + (bodyX * cos - bodyY * sin);
                const wy = pos.y + (bodyX * sin + bodyY * cos);

                smokePuffs.push(new SmokePuff(
                    wx, wy,
                    -cos * (Math.random() * 2 + 1) + (Math.random() - 0.5) * 1.5,
                    -sin * (Math.random() * 2 + 1) + (Math.random() - 0.5) * 1.5,
                    Math.random() * 20 + 12,
                    Math.random() * 15 + 10,
                    Math.random() * Math.PI * 2,
                    Math.random() * 25 + 15
                ));
            }

            ctx.restore();
        }

        let isAnimating = false;
        let animProgress = 0;
        let time = 0;
        const duration = 2.4;

        function triggerPatronus() {
            if (isAnimating) return;
            isAnimating = true;
            animProgress = 0;
        }

        window.addEventListener('click', triggerPatronus);
        window.addEventListener('pointerdown', triggerPatronus);
        window.addEventListener('touchstart', triggerPatronus, { passive: true });

        function getPathPos(t) {
            const startX = width + 220;
            const startY = height + 220;
            const endX = -280;
            const endY = -280;

            const x = startX + (endX - startX) * t + Math.sin(t * Math.PI) * 140;
            const y = startY + (endY - startY) * t - Math.sin(t * Math.PI) * 90;

            const dt = 0.005;
            const nextX = startX + (endX - startX) * (t + dt) + Math.sin((t + dt) * Math.PI) * 140;
            const nextY = startY + (endY - startY) * (t + dt) - Math.sin((t + dt) * Math.PI) * 90;

            const angle = Math.atan2(nextY - y, nextX - x);

            return { x, y, angle };
        }

        const clockStep = 1 / 60;

        function render() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            time += clockStep;

            if (isAnimating) {
                animProgress += clockStep / duration;

                if (animProgress <= 1.0) {
                    const pos = getPathPos(animProgress);
                    drawSmokyPatronus(ctx, time, pos);
                } else {
                    isAnimating = false;
                }
            }

            // Render all ambient smoke trail clouds with high Gaussian blur for a real vaporous look
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            if (ctx.filter !== undefined) ctx.filter = 'blur(10px)';

            for (let i = smokePuffs.length - 1; i >= 0; i--) {
                smokePuffs[i].update();
                smokePuffs[i].draw(ctx);
                if (smokePuffs[i].life <= 0) {
                    smokePuffs.splice(i, 1);
                }
            }
            ctx.restore();

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
