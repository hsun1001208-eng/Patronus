<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Patronus</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{touch-action:manipulation;background:#000}
#stage{position:fixed;inset:0;overflow:hidden;background:#000}
#dolphin{
  position:absolute;
  width:180px;
  height:112px;
  opacity:0;
  pointer-events:none;
  background-image:url("./dolphin-swim-sprite.png");
  background-repeat:no-repeat;
  background-size:calc(180px * 8) 112px;
  will-change:transform,opacity;
  filter:drop-shadow(0 0 8px rgba(150,225,255,.8))
         drop-shadow(0 0 26px rgba(75,180,255,.35));
}
#dolphin.swimming{
  animation: dolphinFrames .68s steps(8,end) infinite;
}
@keyframes dolphinFrames{
  from{background-position:0 0}
  to{background-position:-1260px 0}
}
</style>
</head>
<body>
<div id="stage"><div id="dolphin"></div></div>

<script>
(() => {
  const d = document.getElementById("dolphin");
  let busy = false;
  let raf = 0;

  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

  // Rounded rectangle path. The dolphin remains safely inside the screen
  // during the whole lap; only the final exit goes outside.
  function pathPoint(t,w,h,inset,r){
    const x0=inset, y0=inset, x1=w-inset, y1=h-inset;
    const top=x1-x0-2*r, side=y1-y0-2*r;
    const arc=Math.PI*r/2;
    const lens=[top,arc,side,arc,top,arc,side,arc];
    const total=lens.reduce((a,b)=>a+b,0);
    let q=((t%1)+1)%1*total;

    for(let i=0;i<8;i++){
      if(q<=lens[i]){
        const u=lens[i] ? q/lens[i] : 0;
        if(i===0) return {x:x0+r+u*top,y:y0,dx:1,dy:0};
        if(i===1){const a=-Math.PI/2+u*Math.PI/2;return {x:x1-r+r*Math.cos(a),y:y0+r+r*Math.sin(a),dx:-Math.sin(a),dy:Math.cos(a)}}
        if(i===2) return {x:x1,y:y0+r+u*side,dx:0,dy:1};
        if(i===3){const a=u*Math.PI/2;return {x:x1-r+r*Math.cos(a),y:y1-r+r*Math.sin(a),dx:-Math.sin(a),dy:Math.cos(a)}}
        if(i===4) return {x:x1-r-u*top,y:y1,dx:-1,dy:0};
        if(i===5){const a=Math.PI/2+u*Math.PI/2;return {x:x0+r+r*Math.cos(a),y:y1-r+r*Math.sin(a),dx:-Math.sin(a),dy:Math.cos(a)}}
        if(i===6) return {x:x0,y:y1-r-u*side,dx:0,dy:-1};
        const a=Math.PI+u*Math.PI/2;
        return {x:x0+r+r*Math.cos(a),y:y0+r+r*Math.sin(a),dx:-Math.sin(a),dy:Math.cos(a)};
      }
      q-=lens[i];
    }
    return {x:x1,y:y0,dx:1,dy:0};
  }

  function place(x,y,angle,bank=0,scale=1){
    d.style.transform =
      `translate3d(${x-90}px,${y-56}px,0) rotate(${angle+bank}deg) scale(${scale})`;
  }

  function summon(){
    if(busy) return;
    busy=true;
    const w=innerWidth,h=innerHeight;
    const inset=Math.max(120,Math.min(165,Math.min(w,h)*.15));
    const r=Math.max(42,Math.min(95,Math.min(w,h)*.11));

    // Start near lower-right.
    const startT=.38;
    const start=pathPoint(startT,w,h,inset,r);
    d.style.backgroundSize="1440px 112px";
    d.classList.add("swimming");
    d.style.opacity="0";

    const introStart=performance.now(), introDur=700;
    function intro(now){
      const q=Math.min(1,(now-introStart)/introDur);
      const e=q*q*(3-2*q);
      const p=pathPoint(startT-.035*(1-e),w,h,inset,r);
      const angle=Math.atan2(p.dy,p.dx)*180/Math.PI;
      place(p.x,p.y,angle,Math.sin(q*Math.PI*2)*3,.92+.08*e);
      d.style.opacity=e;
      if(q<1) raf=requestAnimationFrame(intro);
      else lap();
    }
    raf=requestAnimationFrame(intro);

    function lap(){
      const begin=performance.now(), dur=8200;
      function frame(now){
        const q=Math.min(1,(now-begin)/dur);
        const p=pathPoint(startT-q,w,h,inset,r);
        const angle=Math.atan2(p.dy,p.dx)*180/Math.PI;

        // Small body-like vertical oscillation and banking on turns.
        const kick=Math.sin(q*Math.PI*2*10);
        const bob=Math.sin(q*Math.PI*2*10+.65)*4;
        const bank=Math.sin(q*Math.PI*2*2)*4;

        place(p.x,p.y,angle,bank,1);
        d.style.opacity="1";
        if(q<1) raf=requestAnimationFrame(frame);
        else exit(p);
      }
      raf=requestAnimationFrame(frame);
    }

    function exit(from){
      const begin=performance.now(), dur=1050;
      function frame(now){
        const q=Math.min(1,(now-begin)/dur);
        const e=q*q*(3-2*q);
        const x=from.x+(-220-from.x)*e;
        const y=from.y+(-160-from.y)*e;
        place(x,y,-135,0,1-.06*e);
        d.style.opacity=1-e;
        if(q<1) raf=requestAnimationFrame(frame);
        else{
          d.classList.remove("swimming");
          d.style.opacity=0;
          busy=false;
        }
      }
      raf=requestAnimationFrame(frame);
    }
  }

  document.addEventListener("pointerdown",summon,{passive:true});
  addEventListener("pagehide",()=>cancelAnimationFrame(raf));
})();
</script>
</body>
</html>
