<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patronus Dolphin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            background-color: #000000;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="webgl"></canvas>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- Scene & Camera ---
        const canvas = document.getElementById('webgl');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 45);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x000000, 1);

        // --- Custom Patronus Shader ---
        const patronusVertexShader = `
            uniform float uTime;
            
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            varying vec3 vWorldPosition;
            varying float vTailFactor;
            
            void main() {
                vNormal = normalize(normalMatrix * normal);
                
                vec3 pos = position;
                
                // Natural dolphin undulating body movement (sine wave along Z axis)
                float wave = sin(uTime * 7.0 - pos.z * 0.3) * 0.8;
                
                // Tail moves significantly more than head
                float tailFactor = smoothstep(2.0, -8.0, pos.z);
                vTailFactor = tailFactor;
                
                pos.y += wave * tailFactor * 0.6;
                pos.x += sin(uTime * 3.5 - pos.z * 0.2) * tailFactor * 0.3;
                
                vec4 worldPosition = modelMatrix * vec4(pos, 1.0);
                vWorldPosition = worldPosition.xyz;
                
                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                vViewPosition = -mvPosition.xyz;
                
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const patronusFragmentShader = `
            uniform float uTime;
            uniform float uOpacity;
            
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            varying vec3 vWorldPosition;
            varying float vTailFactor;

            // 3D Noise function
            float hash(float n) { return fract(sin(n) * 43758.5453123); }
            float noise(vec3 x) {
                vec3 p = floor(x);
                vec3 f = fract(x);
                f = f*f*(3.0-2.0*f);
                float n = p.x + p.y*57.0 + 113.0*p.z;
                return mix(mix(mix(hash(n+0.0), hash(n+1.0),f.x),
                               mix(hash(n+57.0), hash(n+58.0),f.x),f.y),
                           mix(mix(hash(n+113.0), hash(n+114.0),f.x),
                               mix(hash(n+170.0), hash(n+171.0),f.x),f.y),f.z);
            }

            void main() {
                vec3 normal = normalize(vNormal);
                vec3 viewDir = normalize(vViewPosition);

                // Intense Fresnel rim glowing effect
                float fresnel = pow(1.0 - abs(dot(normal, viewDir)), 2.0);

                // Flowing smoky wisps across body surface
                vec3 noisePos = vWorldPosition * 0.25 + vec3(0.0, uTime * 1.2, uTime * 0.8);
                float smoke = noise(noisePos);
                
                // Silver-Blue Harry Potter Patronus Palette
                vec3 coreColor = vec3(0.3, 0.7, 1.0);    // Magical Cyan-Blue
                vec3 edgeColor = vec3(0.9, 0.96, 1.0);   // Glowing Silver White
                vec3 deepBlue  = vec3(0.05, 0.25, 0.65); // Deep Ether

                vec3 color = mix(deepBlue, coreColor, smoke * 0.8 + 0.2);
                color = mix(color, edgeColor, fresnel * 0.85);

                // Add rim aura light
                color += edgeColor * pow(fresnel, 3.0) * 1.5;

                float alpha = (fresnel * 0.75 + smoke * 0.35 + 0.15) * uOpacity;
                
                gl_FragColor = vec4(color, clamp(alpha, 0.0, 1.0));
            }
        `;

        // --- Anatomically Detailed Dolphin Geometry Generator ---
        function buildDetailedDolphinGeometry() {
            const geometry = new THREE.BufferGeometry();
            
            const radialSegs = 24;
            const lengthSegs = 60;
            
            const vertices = [];
            const uvs = [];
            const indices = [];

            function getProfile(z) {
                let rX = 0, rY = 0, offsetY = 0;

                if (z > 6.5) {
                    // Beak / Snout
                    let t = (8.0 - z) / 1.5;
                    rX = 0.15 + t * 0.25;
                    rY = 0.12 + t * 0.2;
                } else if (z > 4.5) {
                    // Melon / Head Transition
                    let t = (6.5 - z) / 2.0;
                    rX = 0.4 + t * 1.2;
                    rY = 0.32 + t * 1.3;
                    offsetY = Math.sin(t * Math.PI) * 0.3; // Forehead bulge (melon)
                } else if (z > -3.0) {
                    // Main Torso (Sleek stream-lined body)
                    let t = (4.5 - z) / 7.5;
                    rX = 1.6 * Math.sin(t * Math.PI * 0.85 + 0.3);
                    rY = 2.1 * Math.sin(t * Math.PI * 0.85 + 0.3);
                    offsetY = Math.sin(t * Math.PI) * 0.2;
                } else if (z > -7.5) {
                    // Tapering Tail Stock
                    let t = (-3.0 - z) / 4.5;
                    rX = 1.35 * (1.0 - t * 0.75);
                    rY = 1.7 * (1.0 - t * 0.75);
                } else {
                    // Fluke Connection
                    let t = (-7.5 - z) / 2.5;
                    rX = 0.35 * (1.0 - t * 0.5);
                    rY = 0.4 * (1.0 - t * 0.5);
                }

                return { rX, rY, offsetY };
            }

            for (let i = 0; i <= lengthSegs; i++) {
                const z = 8.0 - (i / lengthSegs) * 18.0;
                const profile = getProfile(z);

                for (let j = 0; j <= radialSegs; j++) {
                    const theta = (j / radialSegs) * Math.PI * 2;
                    let vx = Math.cos(theta) * profile.rX;
                    let vy = Math.sin(theta) * profile.rY + profile.offsetY;
                    let vz = z;

                    // --- Append Dorsal Fin (Top, around z = -0.5 to -3.5) ---
                    if (z < 0.5 && z > -3.5 && theta > Math.PI * 0.35 && theta < Math.PI * 0.65) {
                        let finT = (0.5 - z) / 4.0;
                        let finFactor = Math.sin(finT * Math.PI);
                        let angleCenter = Math.PI * 0.5;
                        let distFromCenter = 1.0 - Math.abs(theta - angleCenter) / (Math.PI * 0.15);
                        let finHeight = finFactor * distFromCenter * 2.2;
                        
                        vy += finHeight;
                        vz -= finHeight * 0.4;
                    }

                    // --- Append Pectoral Flippers (Sides, around z = 2.0 to 0.0) ---
                    if (z < 2.5 && z > -0.5 && theta > Math.PI * 1.15 && theta < Math.PI * 1.45) {
                        let flipT = (2.5 - z) / 3.0;
                        let flipFactor = Math.sin(flipT * Math.PI);
                        let dist = 1.0 - Math.abs(theta - Math.PI * 1.3) / (Math.PI * 0.15);
                        vx += flipFactor * dist * 3.2;
                        vy -= flipFactor * dist * 0.8;
                        vz -= flipFactor * dist * 1.2;
                    }
                    if (z < 2.5 && z > -0.5 && theta > Math.PI * 1.55 && theta < Math.PI * 1.85) {
                        let flipT = (2.5 - z) / 3.0;
                        let flipFactor = Math.sin(flipT * Math.PI);
                        let dist = 1.0 - Math.abs(theta - Math.PI * 1.7) / (Math.PI * 0.15);
                        vx -= flipFactor * dist * 3.2;
                        vy -= flipFactor * dist * 0.8;
                        vz -= flipFactor * dist * 1.2;
                    }

                    // --- Append Tail Fluke (Wide horizontal blade at z < -8.0) ---
                    if (z <= -8.0) {
                        let flukeT = (-8.0 - z) / 2.0;
                        let span = flukeT * 5.5;
                        if (vx >= 0) vx += span;
                        else vx -= span;
                        vy *= (1.0 - flukeT * 0.7);
                    }

                    vertices.push(vx, vy, vz);
                    uvs.push(j / radialSegs, i / lengthSegs);
                }
            }

            for (let i = 0; i < lengthSegs; i++) {
                for (let j = 0; j < radialSegs; j++) {
                    const first = (i * (radialSegs + 1)) + j;
                    const second = first + radialSegs + 1;

                    indices.push(first, second, first + 1);
                    indices.push(second, second + 1, first + 1);
                }
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
            geometry.setIndex(indices);
            geometry.computeVertexNormals();

            return geometry;
        }

        // --- Material & Mesh Setup ---
        const patronusMaterial = new THREE.ShaderMaterial({
            vertexShader: patronusVertexShader,
            fragmentShader: patronusFragmentShader,
            uniforms: {
                uTime: { value: 0 },
                uOpacity: { value: 1.0 }
            },
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide
        });

        const dolphinMesh = new THREE.Mesh(buildDetailedDolphinGeometry(), patronusMaterial);
        
        const dolphinGroup = new THREE.Group();
        dolphinGroup.add(dolphinMesh);
        scene.add(dolphinGroup);
        dolphinGroup.visible = false;

        // --- Ethereal Particle Trail ---
        const particleCount = 300;
        const particleGeo = new THREE.BufferGeometry();
        const pPositions = new Float32Array(particleCount * 3);
        const pAlphas = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            pPositions[i * 3] = 9999;
            pPositions[i * 3 + 1] = 9999;
            pPositions[i * 3 + 2] = 9999;
            pAlphas[i] = 0.0;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
        particleGeo.setAttribute('alpha', new THREE.BufferAttribute(pAlphas, 1));

        const particleMat = new THREE.ShaderMaterial({
            uniforms: { color: { value: new THREE.Color(0xaae5ff) } },
            vertexShader: `
                attribute float alpha;
                varying float vAlpha;
                void main() {
                    vAlpha = alpha;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = (16.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform vec3 color;
                varying float vAlpha;
                void main() {
                    float d = length(gl_PointCoord - vec2(0.5));
                    if (d > 0.5) discard;
                    float glow = pow(1.0 - d * 2.0, 2.0);
                    gl_FragColor = vec4(color, vAlpha * glow);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);

        let pIdx = 0;
        function emitParticles(pos) {
            for (let k = 0; k < 2; k++) {
                const idx = (pIdx++) % particleCount;
                pPositions[idx * 3] = pos.x + (Math.random() - 0.5) * 2.0;
                pPositions[idx * 3 + 1] = pos.y + (Math.random() - 0.5) * 2.0;
                pPositions[idx * 3 + 2] = pos.z + (Math.random() - 0.5) * 2.0;
                pAlphas[idx] = 0.85;
            }
            particleGeo.attributes.position.needsUpdate = true;
            particleGeo.attributes.alpha.needsUpdate = true;
        }

        function updateParticles() {
            const arr = particleGeo.attributes.alpha.array;
            for (let i = 0; i < particleCount; i++) {
                if (arr[i] > 0) {
                    arr[i] -= 0.015;
                    if (arr[i] < 0) arr[i] = 0;
                }
            }
            particleGeo.attributes.alpha.needsUpdate = true;
        }

        // --- Path Swimming Curve ---
        const pathCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(38, -28, -10),
            new THREE.Vector3(22, -14, 5),
            new THREE.Vector3(2, 2, 12),
            new THREE.Vector3(-18, 16, 2),
            new THREE.Vector3(-42, 32, -12)
        ]);

        let isAnimating = false;
        let progress = 0;
        const duration = 5.0;

        function triggerAnimation() {
            if (isAnimating) return;
            isAnimating = true;
            progress = 0;
            dolphinGroup.visible = true;
            patronusMaterial.uniforms.uOpacity.value = 1.0;
        }

        window.addEventListener('click', triggerAnimation);
        window.addEventListener('pointerdown', triggerAnimation);
        window.addEventListener('touchstart', triggerAnimation, { passive: true });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            patronusMaterial.uniforms.uTime.value = time;

            if (isAnimating) {
                progress += delta / duration;

                if (progress <= 1.0) {
                    const point = pathCurve.getPoint(progress);
                    dolphinGroup.position.copy(point);

                    const tangent = pathCurve.getTangent(progress).normalize();
                    const lookTarget = point.clone().add(tangent);
                    dolphinGroup.lookAt(lookTarget);

                    const bank = Math.sin(progress * Math.PI * 1.5) * 0.4;
                    dolphinGroup.rotateZ(bank);

                    const tailOffset = tangent.clone().multiplyScalar(-8);
                    emitParticles(point.clone().add(tailOffset));

                    if (progress > 0.82) {
                        patronusMaterial.uniforms.uOpacity.value = (1.0 - progress) / 0.18;
                    }
                } else {
                    isAnimating = false;
                    dolphinGroup.visible = false;
                }
            }

            updateParticles();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
