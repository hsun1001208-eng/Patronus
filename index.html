<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patronus Dolphin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            background-color: #000000;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Ambient Smoke Particles
        const smokePuffs = [];

        class SmokePuff {
            constructor(x, y, vx, vy, rx, ry, angle, maxLife) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.rx = rx;
                this.ry = ry;
                this.angle = angle;
                this.life = maxLife;
                this.maxLife = maxLife;
                this.vRot = (Math.random() - 0.5) * 0.04;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.rx += 1.0;
                this.ry += 0.9;
                this.angle += this.vRot;
                this.life--;
            }

            draw(ctx) {
                if (this.life <= 0) return;
                const alpha = Math.sin((this.life / this.maxLife) * Math.PI);

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.rx);
                grad.addColorStop(0, `rgba(220, 248, 255, ${alpha * 0.20})`);
                grad.addColorStop(0.35, `rgba(110, 210, 255, ${alpha * 0.12})`);
                grad.addColorStop(0.75, `rgba(20, 110, 220, ${alpha * 0.03})`);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.rx, this.ry, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Spine Wave
        function getSpineY(x, time) {
            const swimFreq = 12.0;
            const norm = (180 - x) / 360;
            if (norm < 0.2) return Math.sin(norm * Math.PI) * 2.0;
            const flexFactor = Math.pow((norm - 0.2) / 0.8, 1.85);
            return Math.sin(time * swimFreq - norm * 3.6) * 40 * flexFactor;
        }

        // Correct Anatomy Mesh
        function drawDolphinMesh(ctx, time) {
            ctx.beginPath();

            const snoutY = getSpineY(185, time);
            ctx.moveTo(185, snoutY);

            // --- 1. 上半身：背部 & 背鰭 (向上) ---
            ctx.quadraticCurveTo(165, getSpineY(165, time) + 3, 152, getSpineY(152, time) + 8);
            ctx.quadraticCurveTo(120, getSpineY(120, time) + 37, 68, getSpineY(68, time) + 40);

            // 背鰭 (Dorsal Fin - 向上)
            const dBaseY = getSpineY(14, time);
            ctx.lineTo(20, dBaseY + 37);
            ctx.quadraticCurveTo(-7, dBaseY + 82, -30, dBaseY + 86);
            ctx.quadraticCurveTo(-20, dBaseY + 53, -24, dBaseY + 32);

            // 背部後段 -> 尾柄
            ctx.quadraticCurveTo(-80, getSpineY(-80, time) + 21, -145, getSpineY(-145, time) + 8);

            // 雙葉尾鰭
            const tailY = getSpineY(-178, time);
            ctx.lineTo(-172, tailY + 42);
            ctx.quadraticCurveTo(-182, tailY + 21, -175, tailY);
            ctx.quadraticCurveTo(-182, tailY - 21, -172, tailY - 42);

            // --- 2. 下半身：腹部 & 胸鰭 (向下) ---
            ctx.lineTo(-145, getSpineY(-145, time) - 8);
            ctx.quadraticCurveTo(-80, getSpineY(-80, time) - 21, -26, getSpineY(-26, time) - 29);

            // 胸鰭 (Pectoral Flipper - 向下)
            const pBaseY = getSpineY(33, time);
            ctx.lineTo(26, pBaseY - 29);
            ctx.quadraticCurveTo(-3, pBaseY - 72, -29, pBaseY - 78);
            ctx.quadraticCurveTo(-13, pBaseY - 48, 46, pBaseY - 24);

            // 腹部 -> 吻部
            ctx.quadraticCurveTo(106, getSpineY(106, time) - 16, 152, getSpineY(152, time) - 5);
            ctx.lineTo(185, snoutY);
            ctx.closePath();
        }

        // Draw Extra-Misty Smoky Dolphin
        function drawUltraMistyPatronus(ctx, time, pos) {
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(pos.angle);

            ctx.globalCompositeOperation = 'lighter';

            // --- Layer 1: 極致大範圍瀰漫煙霧 (Blur 60px) ---
            ctx.save();
            if (ctx.filter !== undefined) ctx.filter = 'blur(60px)';
            ctx.shadowColor = '#60d0ff';
            ctx.shadowBlur = 50;

            drawDolphinMesh(ctx, time);
            const grad1 = ctx.createLinearGradient(185, 0, -178, 0);
            grad1.addColorStop(0, 'rgba(210, 245, 255, 0.35)');
            grad1.addColorStop(0.3, 'rgba(100, 200, 255, 0.22)');
            grad1.addColorStop(0.7, 'rgba(20, 120, 230, 0.10)');
            grad1.addColorStop(1, 'rgba(0, 40, 160, 0.02)');
            ctx.fillStyle = grad1;
            ctx.fill();
            ctx.restore();

            // --- Layer 2: 柔和中層雲氣 (Blur 35px) ---
            ctx.save();
            if (ctx.filter !== undefined) ctx.filter = 'blur(35px)';

            drawDolphinMesh(ctx, time);
            const grad2 = ctx.createLinearGradient(185, 0, -178, 0);
            grad2.addColorStop(0, 'rgba(240, 252, 255, 0.38)');
            grad2.addColorStop(0.35, 'rgba(140, 220, 255, 0.22)');
            grad2.addColorStop(0.75, 'rgba(40, 150, 240, 0.10)');
            grad2.addColorStop(1, 'rgba(5, 70, 190, 0.02)');
            ctx.fillStyle = grad2;
            ctx.fill();
            ctx.restore();

            // --- Layer 3: 輕柔靈體核心 (Blur 20px - 高度羽化無任何實線) ---
            ctx.save();
            if (ctx.filter !== undefined) ctx.filter = 'blur(20px)';

            drawDolphinMesh(ctx, time);
            const grad3 = ctx.createLinearGradient(185, 0, -178, 0);
            grad3.addColorStop(0, 'rgba(255, 255, 255, 0.42)');
            grad3.addColorStop(0.25, 'rgba(190, 238, 255, 0.25)');
            grad3.addColorStop(0.6, 'rgba(80, 185, 255, 0.12)');
            grad3.addColorStop(1, 'rgba(10, 100, 210, 0.02)');
            ctx.fillStyle = grad3;
            ctx.fill();
            ctx.restore();

            // --- Layer 4: 沿脊椎分佈的煙霧光球 (Inner Vapor Orbs to break solid shape) ---
            ctx.save();
            if (ctx.filter !== undefined) ctx.filter = 'blur(16px)';
            const spinePoints = [150, 100, 50, 0, -50, -100, -140];
            spinePoints.forEach((px, idx) => {
                const py = getSpineY(px, time);
                const r = 38 - idx * 3;
                const orbGrad = ctx.createRadialGradient(px, py, 0, px, py, r);
                orbGrad.addColorStop(0, 'rgba(255, 255, 255, 0.28)');
                orbGrad.addColorStop(0.5, 'rgba(120, 215, 255, 0.15)');
                orbGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = orbGrad;
                ctx.beginPath();
                ctx.arc(px, py, r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();

            // --- Layer 5: 尾部蒸氣噴吐 (Trailing Smoke) ---
            const cos = Math.cos(pos.angle);
            const sin = Math.sin(pos.angle);

            const tailY = getSpineY(-178, time);
            for (let k = 0; k < 6; k++) {
                const tWy = tailY + (Math.random() - 0.5) * 40;
                const wx = pos.x + (-170 * cos - tWy * sin);
                const wy = pos.y + (-170 * sin + tWy * cos);

                smokePuffs.push(new SmokePuff(
                    wx, wy,
                    -cos * (Math.random() * 5 + 2.5) + (Math.random() - 0.5) * 2,
                    -sin * (Math.random() * 5 + 2.5) + (Math.random() - 0.5) * 2,
                    Math.random() * 40 + 28,
                    Math.random() * 32 + 20,
                    Math.random() * Math.PI * 2,
                    Math.random() * 40 + 30
                ));
            }

            ctx.restore();
        }

        let isAnimating = false;
        let animProgress = 0;
        let time = 0;
        const duration = 2.5;

        function triggerPatronus() {
            if (isAnimating) return;
            isAnimating = true;
            animProgress = 0;
        }

        window.addEventListener('click', triggerPatronus);
        window.addEventListener('pointerdown', triggerPatronus);
        window.addEventListener('touchstart', triggerPatronus, { passive: true });

        function getPathPos(t) {
            const startX = width + 280;
            const startY = height + 280;
            const endX = -350;
            const endY = -350;

            const x = startX + (endX - startX) * t + Math.sin(t * Math.PI) * 160;
            const y = startY + (endY - startY) * t - Math.sin(t * Math.PI) * 110;

            const dt = 0.005;
            const nextX = startX + (endX - startX) * (t + dt) + Math.sin((t + dt) * Math.PI) * 160;
            const nextY = startY + (endY - startY) * (t + dt) - Math.sin((t + dt) * Math.PI) * 110;

            const angle = Math.atan2(nextY - y, nextX - x);

            return { x, y, angle };
        }

        const clockStep = 1 / 60;

        function render() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            time += clockStep;

            if (isAnimating) {
                animProgress += clockStep / duration;

                if (animProgress <= 1.0) {
                    const pos = getPathPos(animProgress);
                    drawUltraMistyPatronus(ctx, time, pos);
                } else {
                    isAnimating = false;
                }
            }

            // Render ambient smoke trail
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            if (ctx.filter !== undefined) ctx.filter = 'blur(18px)';

            for (let i = smokePuffs.length - 1; i >= 0; i--) {
                smokePuffs[i].update();
                smokePuffs[i].draw(ctx);
                if (smokePuffs[i].life <= 0) {
                    smokePuffs.splice(i, 1);
                }
            }
            ctx.restore();

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
