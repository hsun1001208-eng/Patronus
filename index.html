<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patronus Dolphin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            background-color: #000000;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Trail smoke particles
        const particles = [];

        class TailSmoke {
            constructor(x, y, vx, vy) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.size = Math.random() * 18 + 12;
                this.life = 1.0;
                this.decay = Math.random() * 0.03 + 0.02;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.size += 0.4;
                this.life -= this.decay;
            }
            draw(ctx) {
                if (this.life <= 0) return;
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                grad.addColorStop(0, `rgba(180, 235, 255, ${this.life * 0.4})`);
                grad.addColorStop(0.5, `rgba(40, 160, 240, ${this.life * 0.15})`);
                grad.addColorStop(1, 'rgba(0, 50, 150, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Real organic Dolphin Skeleton Points deformed along a backbone Spine Curve
        // x offset along spine: Snout (+120) to Tail (-120)
        function drawDolphinBody(ctx, time) {
            // Frequency & speed of swimming tail stroke
            const swimFreq = 16.0;
            const wave = Math.sin(time * swimFreq);
            const waveCos = Math.cos(time * swimFreq);

            // Compute spine offsets (Y offset perpendicular to spine)
            // Head stays stable, mid body flexes, tail flexes heavily
            function getSpineY(x) {
                // x goes from +130 (snout) to -120 (tail)
                const norm = (130 - x) / 250; // 0 at head, 1 at tail
                if (norm < 0.25) {
                    return Math.sin(norm * Math.PI) * 2; // Head stays nearly still
                }
                const flexFactor = Math.pow((norm - 0.25) / 0.75, 1.8);
                return Math.sin(time * swimFreq - norm * 3.5) * 28 * flexFactor;
            }

            // Generate Spine reference points
            const spine = [];
            for (let x = 130; x >= -130; x -= 5) {
                spine.push({ x: x, y: getSpineY(x) });
            }

            // Build crisp, anatomically recognizable Dolphin 2D Outline
            ctx.save();
            ctx.shadowColor = '#00e5ff';
            ctx.shadowBlur = 20;

            // Gradient filling for magical Patronus look
            const grad = ctx.createLinearGradient(120, 0, -120, 0);
            grad.addColorStop(0, '#ffffff');       // Pure bright head
            grad.addColorStop(0.3, '#a5f3fc');     // Glowing cyan neck
            grad.addColorStop(0.7, '#38bdf8');     // Bright blue body
            grad.addColorStop(1.0, '#0284c7');     // Ether tail

            ctx.fillStyle = grad;
            ctx.strokeStyle = '#e0f2fe';
            ctx.lineWidth = 2.5;

            ctx.beginPath();

            // 1. Start at Beak tip
            const snoutY = getSpineY(130);
            ctx.moveTo(130, snoutY);

            // 2. Beak top -> Melon (Forehead bulge)
            ctx.quadraticCurveTo(110, getSpineY(110) - 8, 90, getSpineY(90) - 16);
            ctx.quadraticCurveTo(65, getSpineY(65) - 28, 30, getSpineY(30) - 30);

            // 3. Dorsal Fin (背鰭)
            const dorsalBaseY = getSpineY(5);
            ctx.lineTo(15, dorsalBaseY - 30);
            ctx.quadraticCurveTo(-5, dorsalBaseY - 65, -20, dorsalBaseY - 68); // Tip curved back
            ctx.quadraticCurveTo(-15, dorsalBaseY - 42, -22, dorsalBaseY - 26); // Trailing edge

            // 4. Back -> Tail Stock
            ctx.quadraticCurveTo(-60, getSpineY(-60) - 18, -100, getSpineY(-100) - 8);

            // 5. Upper Tail Fluke Blade (尾鰭上葉)
            const tailY = getSpineY(-125);
            ctx.lineTo(-120, tailY - 32);
            ctx.quadraticCurveTo(-128, tailY - 18, -125, tailY);

            // 6. Lower Tail Fluke Blade (尾鰭下葉)
            ctx.quadraticCurveTo(-128, tailY + 18, -120, tailY + 32);

            // 7. Tail Stock Bottom -> Belly
            ctx.lineTo(-100, getSpineY(-100) + 8);
            ctx.quadraticCurveTo(-60, getSpineY(-60) + 16, -20, getSpineY(-20) + 22);

            // 8. Pectoral Flipper (胸鰭)
            const pecBaseY = getSpineY(15);
            ctx.lineTo(10, pecBaseY + 22);
            ctx.quadraticCurveTo(-10, pecBaseY + 52, -28, pecBaseY + 56); // Tip
            ctx.quadraticCurveTo(-15, pecBaseY + 35, 30, pecBaseY + 20); // Inner trailing edge

            // 9. Lower Jaw / Beak bottom
            ctx.quadraticCurveTo(70, getSpineY(70) + 16, 110, getSpineY(110) + 6);
            ctx.lineTo(130, snoutY);

            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Inner Smoky Aura Wisps inside the dolphin body
            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.beginPath();
            ctx.arc(80, getSpineY(80), 12, 0, Math.PI * 2);
            ctx.arc(30, getSpineY(30), 18, 0, Math.PI * 2);
            ctx.arc(-20, getSpineY(-20), 14, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // Spawn smoke particles from tail fluke
            const tailWorldY = tailY;
            return { tailX: -125, tailY: tailWorldY };
        }

        let isAnimating = false;
        let animProgress = 0;
        let time = 0;
        const duration = 2.2; // Fast swim speed (~2.2 seconds across screen)

        function triggerPatronus() {
            if (isAnimating) return;
            isAnimating = true;
            animProgress = 0;
        }

        window.addEventListener('click', triggerPatronus);
        window.addEventListener('pointerdown', triggerPatronus);
        window.addEventListener('touchstart', triggerPatronus, { passive: true });

        // Trajectory from Right-Bottom to Left-Top
        function getPathPos(t) {
            const startX = width + 200;
            const startY = height + 200;
            const endX = -250;
            const endY = -250;

            // Organic curved swimming arch
            const x = startX + (endX - startX) * t + Math.sin(t * Math.PI) * 120;
            const y = startY + (endY - startY) * t - Math.sin(t * Math.PI) * 80;

            // Calculate tangent angle for facing direction
            const dt = 0.005;
            const nextX = startX + (endX - startX) * (t + dt) + Math.sin((t + dt) * Math.PI) * 120;
            const nextY = startY + (endY - startY) * (t + dt) - Math.sin((t + dt) * Math.PI) * 80;

            const angle = Math.atan2(nextY - y, nextX - x);

            return { x, y, angle };
        }

        const clockStep = 1 / 60;

        function render() {
            // Pure pitch black background
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            time += clockStep;

            if (isAnimating) {
                animProgress += clockStep / duration;

                if (animProgress <= 1.0) {
                    const pos = getPathPos(animProgress);

                    ctx.save();
                    ctx.translate(pos.x, pos.y);
                    ctx.rotate(pos.angle);

                    const tailLocal = drawDolphinBody(ctx, time);

                    // Transform tail coordinates to world coordinates for smoke particles
                    const cos = Math.cos(pos.angle);
                    const sin = Math.sin(pos.angle);
                    const tailWx = pos.x + (tailLocal.tailX * cos - tailLocal.tailY * sin);
                    const tailWy = pos.y + (tailLocal.tailX * sin + tailLocal.tailY * cos);

                    // Emit tail smoke
                    for (let k = 0; k < 3; k++) {
                        particles.push(new TailSmoke(
                            tailWx + (Math.random() - 0.5) * 10,
                            tailWy + (Math.random() - 0.5) * 10,
                            -cos * (Math.random() * 4 + 2) + (Math.random() - 0.5) * 2,
                            -sin * (Math.random() * 4 + 2) + (Math.random() - 0.5) * 2
                        ));
                    }

                    ctx.restore();
                } else {
                    isAnimating = false;
                }
            }

            // Draw trailing smoke particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(ctx);
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
