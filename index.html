<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patronus Dolphin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            background-color: #000000;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Dynamic Mist / Particle Particles
        const particles = [];

        class PatronusParticle {
            constructor(x, y, vx, vy, size, maxLife, colorType) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.size = size;
                this.life = maxLife;
                this.maxLife = maxLife;
                this.colorType = colorType; // 'core', 'mist', 'trail'
                this.angle = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 0.08;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.size += 0.35;
                this.angle += this.vRot;
                this.life--;
            }

            draw(ctx) {
                if (this.life <= 0) return;
                const progress = this.life / this.maxLife;
                // Soft Gaussian-like alpha curve (fade in then fade out smoothly)
                const alpha = Math.sin(progress * Math.PI);

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size);
                if (this.colorType === 'core') {
                    grad.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.85})`);
                    grad.addColorStop(0.3, `rgba(215, 245, 255, ${alpha * 0.5})`);
                    grad.addColorStop(0.7, `rgba(100, 200, 255, ${alpha * 0.18})`);
                    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                } else if (this.colorType === 'mist') {
                    grad.addColorStop(0, `rgba(235, 250, 255, ${alpha * 0.45})`);
                    grad.addColorStop(0.4, `rgba(120, 210, 255, ${alpha * 0.22})`);
                    grad.addColorStop(0.8, `rgba(30, 130, 230, ${alpha * 0.06})`);
                    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                } else { // trail
                    grad.addColorStop(0, `rgba(200, 240, 255, ${alpha * 0.35})`);
                    grad.addColorStop(0.5, `rgba(60, 160, 240, ${alpha * 0.15})`);
                    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                }

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size * 0.55, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Spine deformation for Swimming Animation
        function getSpineY(x, time) {
            const swimFreq = 14.0;
            const norm = (140 - x) / 280;
            if (norm < 0.2) return Math.sin(norm * Math.PI) * 1.5;
            const flexFactor = Math.pow((norm - 0.2) / 0.8, 1.85);
            return Math.sin(time * swimFreq - norm * 3.6) * 32 * flexFactor;
        }

        // Real Movie Style: Ethereal Luminous Vaporous Dolphin
        function drawEtherealPatronus(ctx, time, pos) {
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(pos.angle);

            ctx.globalCompositeOperation = 'lighter';

            // Key Dolphin Anatomy Skeleton Nodes for Vaporous Cloud Generation
            // Head (Snout/Melon), Body, Dorsal Fin, Pectoral Fins, Tail Peduncle, Fluke
            const bodyNodes = [
                { x: 135, r: 10,  weight: 0.9 }, // Snout
                { x: 110, r: 24,  weight: 1.0 }, // Melon/Head
                { x: 80,  r: 35,  weight: 1.0 }, // Neck/Shoulder
                { x: 45,  r: 40,  weight: 1.0 }, // Mid Body
                { x: 10,  r: 36,  weight: 0.95 },// Lower Body
                { x: -25, r: 28,  weight: 0.85 },// Rear
                { x: -60, r: 20,  weight: 0.75 },// Peduncle Top
                { x: -90, r: 14,  weight: 0.65 },// Peduncle Mid
                { x: -115, r: 9,  weight: 0.5 }  // Tail Base
            ];

            // 1. Core Soft Volumetric Mist (Creating the organic body volume WITHOUT outlines)
            bodyNodes.forEach((node, idx) => {
                const py = getSpineY(node.x, time);
                const pulse = Math.sin(time * 8 + idx) * 3;
                const radius = node.r + pulse;

                // Deep Outer Ethereal Aura
                const outerGlow = ctx.createRadialGradient(node.x, py, 0, node.x, py, radius * 2.2);
                outerGlow.addColorStop(0, 'rgba(180, 235, 255, 0.35)');
                outerGlow.addColorStop(0.4, 'rgba(50, 160, 240, 0.18)');
                outerGlow.addColorStop(0.8, 'rgba(10, 80, 180, 0.05)');
                outerGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = outerGlow;
                ctx.beginPath();
                ctx.arc(node.x, py, radius * 2.2, 0, Math.PI * 2);
                ctx.fill();

                // Intense Bright Silver Core
                const coreGlow = ctx.createRadialGradient(node.x, py, 0, node.x, py, radius);
                coreGlow.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
                coreGlow.addColorStop(0.3, 'rgba(220, 245, 255, 0.7)');
                coreGlow.addColorStop(0.65, 'rgba(100, 205, 255, 0.3)');
                coreGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = coreGlow;
                ctx.beginPath();
                ctx.arc(node.x, py, radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // 2. Anatomical Fins made of Light Streaks
            // Dorsal Fin (背鰭)
            const dY = getSpineY(10, time);
            for (let f = 0; f < 5; f++) {
                const fx = 12 - f * 6;
                const fy = dY - 15 - f * 9;
                const fRad = 18 - f * 2.5;
                const fGrad = ctx.createRadialGradient(fx, fy, 0, fx, fy, fRad * 1.5);
                fGrad.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
                fGrad.addColorStop(0.5, 'rgba(120, 215, 255, 0.3)');
                fGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = fGrad;
                ctx.beginPath();
                ctx.arc(fx, fy, fRad * 1.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Pectoral Fins (胸鰭)
            const pY = getSpineY(35, time);
            for (let f = 0; f < 5; f++) {
                const fx = 25 - f * 8;
                const fy = pY + 12 + f * 7;
                const fRad = 16 - f * 2;
                const fGrad = ctx.createRadialGradient(fx, fy, 0, fx, fy, fRad * 1.5);
                fGrad.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
                fGrad.addColorStop(0.5, 'rgba(120, 215, 255, 0.3)');
                fGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = fGrad;
                ctx.beginPath();
                ctx.arc(fx, fy, fRad * 1.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Tail Flukes (雙葉尾鰭)
            const tailY = getSpineY(-125, time);
            [-22, -11, 0, 11, 22].forEach(offsetY => {
                const tx = -130 - Math.abs(offsetY) * 0.4;
                const ty = tailY + offsetY;
                const tRad = 16;
                const tGrad = ctx.createRadialGradient(tx, ty, 0, tx, ty, tRad * 1.4);
                tGrad.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
                tGrad.addColorStop(0.4, 'rgba(140, 220, 255, 0.35)');
                tGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = tGrad;
                ctx.beginPath();
                ctx.arc(tx, ty, tRad * 1.4, 0, Math.PI * 2);
                ctx.fill();
            });

            // 3. Dynamic Swirling Energy Smoke Generation (靈氣粒子)
            const cos = Math.cos(pos.angle);
            const sin = Math.sin(pos.angle);

            // Emit Tail Mist Trails (尾跡巨浪煙霧)
            for (let k = 0; k < 6; k++) {
                const tWy = tailY + (Math.random() - 0.5) * 30;
                const wx = pos.x + (-130 * cos - tWy * sin);
                const wy = pos.y + (-130 * sin + tWy * cos);
                particles.push(new PatronusParticle(
                    wx, wy,
                    -cos * (Math.random() * 6 + 4) + (Math.random() - 0.5) * 3,
                    -sin * (Math.random() * 6 + 4) + (Math.random() - 0.5) * 3,
                    Math.random() * 28 + 18,
                    Math.random() * 40 + 30,
                    'trail'
                ));
            }

            // Emit Body Surface Ethereal Wisps (身體邊緣飄逸的煙霧流)
            for (let b = 0; b < 3; b++) {
                const randNode = bodyNodes[Math.floor(Math.random() * bodyNodes.length)];
                const py = getSpineY(randNode.x, time) + (Math.random() - 0.5) * randNode.r * 1.2;
                const px = randNode.x + (Math.random() - 0.5) * 15;
                const wx = pos.x + (px * cos - py * sin);
                const wy = pos.y + (px * sin + py * cos);

                particles.push(new PatronusParticle(
                    wx, wy,
                    -cos * (Math.random() * 2 + 1) + (Math.random() - 0.5) * 2,
                    -sin * (Math.random() * 2 + 1) + (Math.random() - 0.5) * 2,
                    Math.random() * 22 + 12,
                    Math.random() * 30 + 20,
                    'mist'
                ));
            }

            ctx.restore();
        }

        let isAnimating = false;
        let animProgress = 0;
        let time = 0;
        const duration = 2.4;

        function triggerPatronus() {
            if (isAnimating) return;
            isAnimating = true;
            animProgress = 0;
        }

        window.addEventListener('click', triggerPatronus);
        window.addEventListener('pointerdown', triggerPatronus);
        window.addEventListener('touchstart', triggerPatronus, { passive: true });

        function getPathPos(t) {
            const startX = width + 220;
            const startY = height + 220;
            const endX = -280;
            const endY = -280;

            const x = startX + (endX - startX) * t + Math.sin(t * Math.PI) * 140;
            const y = startY + (endY - startY) * t - Math.sin(t * Math.PI) * 90;

            const dt = 0.005;
            const nextX = startX + (endX - startX) * (t + dt) + Math.sin((t + dt) * Math.PI) * 140;
            const nextY = startY + (endY - startY) * (t + dt) - Math.sin((t + dt) * Math.PI) * 90;

            const angle = Math.atan2(nextY - y, nextX - x);

            return { x, y, angle };
        }

        const clockStep = 1 / 60;

        function render() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            time += clockStep;

            if (isAnimating) {
                animProgress += clockStep / duration;

                if (animProgress <= 1.0) {
                    const pos = getPathPos(animProgress);
                    drawEtherealPatronus(ctx, time, pos);
                } else {
                    isAnimating = false;
                }
            }

            // Render all ambient particles & mist trails with lighter blend mode
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(ctx);
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }
            ctx.restore();

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
