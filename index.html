<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patronus Dolphin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            background-color: #000000;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Dynamic Smoke Wisps Array
        const smokeWisps = [];

        class WispParticle {
            constructor(x, y, vx, vy, size, maxLife, type = 'wisp') {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.size = size;
                this.life = maxLife;
                this.maxLife = maxLife;
                this.type = type;
                this.angle = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 0.08;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.size += (this.type === 'tail' ? 0.6 : 0.25);
                this.angle += this.vRot;
                this.life--;
            }

            draw(ctx) {
                if (this.life <= 0) return;
                const alpha = Math.sin((this.life / this.maxLife) * Math.PI);
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size);
                if (this.type === 'tail') {
                    grad.addColorStop(0, `rgba(220, 245, 255, ${alpha * 0.45})`);
                    grad.addColorStop(0.35, `rgba(50, 180, 255, ${alpha * 0.2})`);
                    grad.addColorStop(0.8, `rgba(5, 70, 180, ${alpha * 0.05})`);
                    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                } else if (this.type === 'edge') {
                    grad.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.6})`);
                    grad.addColorStop(0.4, `rgba(100, 220, 255, ${alpha * 0.25})`);
                    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                } else {
                    grad.addColorStop(0, `rgba(180, 235, 255, ${alpha * 0.35})`);
                    grad.addColorStop(0.5, `rgba(15, 120, 230, ${alpha * 0.12})`);
                    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                }

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Generate Dolphin Path deformer
        function getSpineY(x, time) {
            const swimFreq = 16.0;
            const norm = (130 - x) / 250;
            if (norm < 0.2) {
                return Math.sin(norm * Math.PI) * 1.5;
            }
            const flexFactor = Math.pow((norm - 0.2) / 0.8, 1.85);
            return Math.sin(time * swimFreq - norm * 3.6) * 30 * flexFactor;
        }

        function createDolphinPath(ctx, time) {
            ctx.beginPath();
            const snoutY = getSpineY(130, time);
            ctx.moveTo(130, snoutY);

            ctx.quadraticCurveTo(110, getSpineY(110, time) - 8, 90, getSpineY(90, time) - 16);
            ctx.quadraticCurveTo(65, getSpineY(65, time) - 28, 30, getSpineY(30, time) - 30);

            const dorsalBaseY = getSpineY(5, time);
            ctx.lineTo(15, dorsalBaseY - 30);
            ctx.quadraticCurveTo(-5, dorsalBaseY - 65, -20, dorsalBaseY - 68);
            ctx.quadraticCurveTo(-15, dorsalBaseY - 42, -22, dorsalBaseY - 26);

            ctx.quadraticCurveTo(-60, getSpineY(-60, time) - 18, -100, getSpineY(-100, time) - 8);

            const tailY = getSpineY(-125, time);
            ctx.lineTo(-120, tailY - 32);
            ctx.quadraticCurveTo(-128, tailY - 18, -125, tailY);
            ctx.quadraticCurveTo(-128, tailY + 18, -120, tailY + 32);

            ctx.lineTo(-100, getSpineY(-100, time) + 8);
            ctx.quadraticCurveTo(-60, getSpineY(-60, time) + 16, -20, getSpineY(-20, time) + 22);

            const pecBaseY = getSpineY(15, time);
            ctx.lineTo(10, pecBaseY + 22);
            ctx.quadraticCurveTo(-10, pecBaseY + 52, -28, pecBaseY + 56);
            ctx.quadraticCurveTo(-15, pecBaseY + 35, 30, pecBaseY + 20);

            ctx.quadraticCurveTo(70, getSpineY(70, time) + 16, 110, getSpineY(110, time) + 6);
            ctx.lineTo(130, snoutY);
            ctx.closePath();
        }

        function drawPatronusDolphin(ctx, time, pos) {
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(pos.angle);

            // 1. Soft Semi-Transparent Ethereal Base Body
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';

            // Glow Pass 1: Outer Ethereal Atmosphere
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 35;
            createDolphinPath(ctx, time);
            const outerGrad = ctx.createLinearGradient(130, 0, -125, 0);
            outerGrad.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
            outerGrad.addColorStop(0.3, 'rgba(165, 243, 252, 0.35)');
            outerGrad.addColorStop(0.7, 'rgba(56, 189, 248, 0.25)');
            outerGrad.addColorStop(1, 'rgba(2, 132, 199, 0.15)');
            ctx.fillStyle = outerGrad;
            ctx.fill();

            // Glow Pass 2: Bright Inner Spirit Core
            ctx.shadowColor = '#e0f2fe';
            ctx.shadowBlur = 15;
            createDolphinPath(ctx, time);
            const innerGrad = ctx.createLinearGradient(130, 0, -125, 0);
            innerGrad.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
            innerGrad.addColorStop(0.25, 'rgba(224, 242, 254, 0.4)');
            innerGrad.addColorStop(0.65, 'rgba(125, 211, 252, 0.25)');
            innerGrad.addColorStop(1, 'rgba(14, 165, 233, 0.1)');
            ctx.fillStyle = innerGrad;
            ctx.fill();

            // Glow Pass 3: Soft Silver Rim Light Contour (no solid hard strokes)
            ctx.strokeStyle = 'rgba(240, 249, 255, 0.65)';
            ctx.lineWidth = 1.8;
            ctx.stroke();
            ctx.restore();

            // 2. Dynamic Internal Volumetric Smoke (霧狀靈體感)
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';

            // Flowing interior smoke blobs moving along spine
            const spinePoints = [110, 80, 50, 20, -10, -40, -70, -95];
            spinePoints.forEach((px, i) => {
                const py = getSpineY(px, time);
                const size = (1 - Math.abs(px) / 140) * 22 + 10;
                const offset = Math.sin(time * 12 + i) * 6;

                const smkGrad = ctx.createRadialGradient(px, py + offset, 0, px, py + offset, size);
                smkGrad.addColorStop(0, 'rgba(255, 255, 255, 0.35)');
                smkGrad.addColorStop(0.5, 'rgba(125, 211, 252, 0.18)');
                smkGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = smkGrad;
                ctx.beginPath();
                ctx.arc(px, py + offset, size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();

            // 3. Emit Tail Smoke & Edge Wisps
            const cos = Math.cos(pos.angle);
            const sin = Math.sin(pos.angle);

            // Tail Fluke Smoke Emission (霧狀長尾巴)
            const tailY = getSpineY(-125, time);
            const tailWx = pos.x + (-125 * cos - tailY * sin);
            const tailWy = pos.y + (-125 * sin + tailY * cos);

            for (let k = 0; k < 4; k++) {
                smokeWisps.push(new WispParticle(
                    tailWx + (Math.random() - 0.5) * 16,
                    tailWy + (Math.random() - 0.5) * 16,
                    -cos * (Math.random() * 5 + 3) + (Math.random() - 0.5) * 2,
                    -sin * (Math.random() * 5 + 3) + (Math.random() - 0.5) * 2,
                    Math.random() * 22 + 16,
                    Math.random() * 35 + 25,
                    'tail'
                ));
            }

            // Body Edge Wisps (靈魂煙霧殘影)
            if (Math.random() < 0.7) {
                const randX = (Math.random() - 0.5) * 200;
                const randY = getSpineY(randX, time) + (Math.random() - 0.5) * 25;
                const wx = pos.x + (randX * cos - randY * sin);
                const wy = pos.y + (randX * sin + randY * cos);

                smokeWisps.push(new WispParticle(
                    wx, wy,
                    -cos * (Math.random() * 2 + 1) + (Math.random() - 0.5) * 1.5,
                    -sin * (Math.random() * 2 + 1) + (Math.random() - 0.5) * 1.5,
                    Math.random() * 14 + 10,
                    Math.random() * 25 + 15,
                    'edge'
                ));
            }

            ctx.restore();
        }

        let isAnimating = false;
        let animProgress = 0;
        let time = 0;
        const duration = 2.2;

        function triggerPatronus() {
            if (isAnimating) return;
            isAnimating = true;
            animProgress = 0;
        }

        window.addEventListener('click', triggerPatronus);
        window.addEventListener('pointerdown', triggerPatronus);
        window.addEventListener('touchstart', triggerPatronus, { passive: true });

        function getPathPos(t) {
            const startX = width + 200;
            const startY = height + 200;
            const endX = -250;
            const endY = -250;

            const x = startX + (endX - startX) * t + Math.sin(t * Math.PI) * 120;
            const y = startY + (endY - startY) * t - Math.sin(t * Math.PI) * 80;

            const dt = 0.005;
            const nextX = startX + (endX - startX) * (t + dt) + Math.sin((t + dt) * Math.PI) * 120;
            const nextY = startY + (endY - startY) * (t + dt) - Math.sin((t + dt) * Math.PI) * 80;

            const angle = Math.atan2(nextY - y, nextX - x);

            return { x, y, angle };
        }

        const clockStep = 1 / 60;

        function render() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            time += clockStep;

            if (isAnimating) {
                animProgress += clockStep / duration;

                if (animProgress <= 1.0) {
                    const pos = getPathPos(animProgress);
                    drawPatronusDolphin(ctx, time, pos);
                } else {
                    isAnimating = false;
                }
            }

            // Draw Ethereal Wisps & Smoke Trail
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (let i = smokeWisps.length - 1; i >= 0; i--) {
                smokeWisps[i].update();
                smokeWisps[i].draw(ctx);
                if (smokeWisps[i].life <= 0) {
                    smokeWisps.splice(i, 1);
                }
            }
            ctx.restore();

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
