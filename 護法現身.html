<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>護法現身</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,"Noto Sans TC",sans-serif}
#scene{position:fixed;inset:0;background:#000;overflow:hidden}
#status{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);color:#6c8ca8;
font-size:14px;letter-spacing:2px;opacity:.85;z-index:10;user-select:none}
#start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
padding:14px 24px;border:1px solid #315c82;border-radius:999px;background:#050a10;color:#bfe7ff;
font-size:16px;cursor:pointer;box-shadow:0 0 28px #0a477055;z-index:20}
#start.hidden{display:none}
#spell{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:11;
display:flex;gap:8px;opacity:.9}
#spell input{width:min(420px,70vw);padding:10px 15px;border-radius:22px;border:1px solid #20384e;
background:#030609;color:#d9f3ff;outline:none}
#spell button{width:42px;border:0;border-radius:50%;background:#0877e8;color:white;font-size:18px;cursor:pointer}
.dolphin{position:absolute;width:180px;height:120px;left:0;top:0;filter:drop-shadow(0 0 13px #28a9ff) drop-shadow(0 0 35px #0877e8);
offset-path:path("M 120 720 C 90 610 115 520 260 470 C 430 410 520 300 610 180 C 730 30 910 40 1040 150 C 1170 260 1260 420 1390 470 C 1510 520 1650 460 1740 350 C 1820 250 1840 150 1810 55");
offset-distance:0%;offset-rotate:auto;opacity:0;pointer-events:none;z-index:5}
.dolphin.show{animation:swim 7s cubic-bezier(.18,.72,.22,1) forwards}
@keyframes swim{
0%{offset-distance:0%;opacity:0;transform:scale(.55) rotate(-20deg)}
8%{opacity:1}
50%{transform:scale(1.05)}
88%{opacity:1}
100%{offset-distance:100%;opacity:0;transform:scale(.72)}
}
.guardian{width:180px;height:120px;position:relative}
.body{position:absolute;left:25px;top:35px;width:125px;height:55px;
background:linear-gradient(135deg,#d9fbff 0%,#4dcaff 28%,#1269bd 70%,#071b4c 100%);
border-radius:70% 55% 55% 45%;transform:rotate(-8deg);box-shadow:inset -15px -8px 20px #001b4d88}
.snout{position:absolute;left:137px;top:43px;width:35px;height:20px;background:#4dcaff;
clip-path:polygon(0 15%,100% 50%,0 85%);transform:rotate(-8deg)}
.fin{position:absolute;background:#3cbef6;filter:drop-shadow(0 0 5px #58d9ff)}
.fin.top{left:72px;top:15px;width:35px;height:35px;clip-path:polygon(0 100%,50% 0,100% 100%)}
.fin.bottom{left:75px;top:76px;width:34px;height:25px;clip-path:polygon(0 0,100% 100%,45% 85%)}
.tail{position:absolute;left:5px;top:35px;width:50px;height:58px}
.tail:before,.tail:after{content:"";position:absolute;width:35px;height:35px;background:#3cbef6;clip-path:polygon(0 50%,100% 0,72% 100%)}
.tail:before{top:0;left:0;transform:rotate(-20deg)}
.tail:after{top:25px;left:0;transform:rotate(20deg)}
.eye{position:absolute;left:137px;top:45px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#b9f3ff;box-shadow:0 0 12px #49cfff;animation:spark 1.2s infinite}
.s1{left:15px;top:88px}.s2{left:105px;top:12px;animation-delay:.3s}.s3{left:150px;top:90px;animation-delay:.6s}
@keyframes spark{50%{transform:translateY(-15px) scale(.5);opacity:.25}}
#ring{position:absolute;inset:0;pointer-events:none;opacity:0}
#ring.show{animation:ring 7s ease-out forwards}
@keyframes ring{0%{opacity:0}12%,78%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div id="scene">
  <div id="ring"></div>
  <div class="dolphin" id="dolphin">
    <div class="guardian">
      <div class="tail"></div><div class="body"></div><div class="snout"></div>
      <div class="fin top"></div><div class="fin bottom"></div><div class="eye"></div>
      <i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i>
    </div>
  </div>
</div>
<div id="status">等待咒語……</div>
<button id="start">🎙 開始聆聽</button>
<div id="spell"><input id="input" placeholder="也可以輸入：疾疾 護法現身"><button id="go">➤</button></div>

<script>
const target="疾疾 護法現身";
const dolphin=document.getElementById("dolphin");
const status=document.getElementById("status");
const start=document.getElementById("start");
const input=document.getElementById("input");
let recognition=null;

function summon(){
  dolphin.classList.remove("show");
  void dolphin.offsetWidth;
  dolphin.classList.add("show");
  status.textContent="護法現身！";
  setTimeout(()=>status.textContent="等待咒語……",7200);
}
function containsSpell(t){
  return t.replace(/[，。！？、,.!?\\s]/g,"").includes("疾疾護法現身");
}
document.getElementById("go").onclick=()=>{ if(containsSpell(input.value)) summon(); };
input.addEventListener("keydown",e=>{if(e.key==="Enter" && containsSpell(input.value)) summon()});

function listen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    status.textContent="此瀏覽器不支援語音辨識，請用下方文字框";
    return;
  }
  recognition=new SR();
  recognition.lang="zh-TW";
  recognition.continuous=true;
  recognition.interimResults=true;
  recognition.onstart=()=>{status.textContent="正在聆聽……請說「疾疾 護法現身」";start.classList.add("hidden")};
  recognition.onresult=e=>{
    let text="";
    for(let i=e.resultIndex;i<e.results.length;i++) text+=e.results[i][0].transcript;
    if(containsSpell(text)) summon();
  };
  recognition.onerror=()=>{status.textContent="語音辨識暫時中斷，請再試一次";};
  recognition.onend=()=>{ if(!start.classList.contains("hidden")) return; setTimeout(()=>{try{recognition.start()}catch(e){}},300); };
  recognition.start();
}
start.onclick=listen;
</script>
</body>
</html>
